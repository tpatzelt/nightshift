# NIGHTSHIFT — one Compose project, every resource prefixed "nightshift-".
# Teardown: docker compose -p nightshift down -v && rm -rf ~/nightshift
name: nightshift

services:
  # Inner Docker daemon. Agent containers, the jail network and the egress proxy
  # all live in here, so orchestrator cleanup can never touch Tim's real daemon.
  dind:
    image: ${NS_DIND_IMAGE}
    container_name: nightshift-dind
    privileged: true
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      - nightshift-dind-lib:/var/lib/docker   # inner images + containers
      - nightshift-certs:/certs
      - ./data:/data                          # SAME path as in orchestrator (see §2 gotcha)
      - ./proxy:/proxy:ro                     # ditto: the proxy container mounts these
      - ./dind-init:/dind-init:ro
    networks:
      nightshift-net:
        # The dind server certificate is issued for "docker"/"localhost" only, so
        # the orchestrator must reach it under that name.
        aliases: [docker]
    # deliberately no published ports: the inner API is reachable only on nightshift-net
    healthcheck:
      test: ["CMD", "docker", "-H", "tcp://127.0.0.1:2376", "--tlsverify",
             "--tlscacert", "/certs/client/ca.pem",
             "--tlscert", "/certs/client/cert.pem",
             "--tlskey", "/certs/client/key.pem", "info"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  orchestrator:
    build:
      context: ./orchestrator
      args:
        NS_PYTHON_IMAGE: ${NS_PYTHON_IMAGE}
        NS_DIND_IMAGE: ${NS_DIND_IMAGE}
    image: nightshift-orchestrator:local
    container_name: nightshift-orchestrator
    restart: unless-stopped
    depends_on:
      dind:
        condition: service_healthy
    environment:
      DOCKER_HOST: tcp://docker:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client
    env_file: .env
    volumes:
      - nightshift-certs:/certs:ro
      - ./data:/data
      - ./secrets:/secrets:ro
      - ./sandbox:/sandbox:ro                 # build context for the agent image
      - ./proxy:/proxy:ro
      # A finished run is archived here, into the git-tracked charters/ tree.
      - ./charters:/charters
      # Read-only: the loop clones a charter's project from here into a bare repo
      # under /data/repos. Nothing ever writes back to Tim's working copies.
      - ${NS_CODING_DIR:-/home/tim/coding}:/coding:ro
    networks: [nightshift-net]
    healthcheck:
      test: ["CMD", "python3", "/app/healthcheck.py"]
      interval: 5m
      timeout: 30s
      retries: 3
      start_period: 3m

  # The dashboard: progress, the charter queue, and the buttons. Same image as the
  # orchestrator, none of its privileges - no docker socket, no OAuth token, no
  # certificates. It writes a queue entry and a command file; the loop does the rest,
  # which keeps state.json single-writer.
  web:
    image: nightshift-orchestrator:local
    build:
      context: ./orchestrator
      args:
        NS_PYTHON_IMAGE: ${NS_PYTHON_IMAGE}
        NS_DIND_IMAGE: ${NS_DIND_IMAGE}
    container_name: nightshift-web
    command: ["web"]
    restart: unless-stopped
    env_file: .env
    environment:
      NS_WEB_PORT: "8080"
    volumes:
      - ./data:/data
      - ./charters:/charters:ro
      - ${NS_CODING_DIR:-/home/tim/coding}:/coding:ro
    # No published port: Caddy reaches it over caddy_network, and *.dev is a
    # LAN-only wildcard. See the Caddyfile note - the UI can spend real money,
    # so it sits behind basic auth there.
    networks: [nightshift-net, caddy_network]
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=5).status == 200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  nightshift-dind-lib:
    name: nightshift-dind-lib
  nightshift-certs:
    name: nightshift-certs

networks:
  nightshift-net:
    name: nightshift-net
  # Created by the homelab caddy stack; the dashboard joins it to be proxied.
  caddy_network:
    external: true
    name: caddy_network
