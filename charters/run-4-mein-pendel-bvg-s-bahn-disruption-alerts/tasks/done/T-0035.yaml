why: G4 needs a non-root Dockerfile with a healthcheck, a compose file that follows
  the homelab conventions (external caddy_network, /opt/dockerdata/pendel, pinned
  images, env_file secrets, no host ports), a workflow that runs the tests and publishes
  ghcr.io/tpatzelt/mein-pendel:latest and sha-<short>, and a DEPLOY.md. None of these
  files exist in the repo. Parked T-0032 was accepted except for two operational bugs.
  First, `PENDEL_CHECK_LEAD_MIN=` shipped empty, and scheduler._lead_minutes_from_env
  runs int('') on it and crashes. Second, DEPLOY.md put the env file at a different
  path from the one compose's env_file resolves, and that path was inside the data
  volume.
