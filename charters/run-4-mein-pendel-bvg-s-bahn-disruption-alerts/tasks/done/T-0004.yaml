why: 'This is the core of G1. It decides deterministically whether a commute is affected:
  cancellation, Ersatzverkehr, delay above the threshold, or a construction remark
  on a line or stop the commute uses. It returns a short German and English reason.
  The engine must ignore disruptions on lines the user does not ride.'
