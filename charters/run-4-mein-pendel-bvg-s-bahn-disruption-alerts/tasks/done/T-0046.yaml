title: Commute rejects a negative delay_threshold_min and a window_end before window_start;
  POST /commutes answers 400 and saves no row for either
why: 'G1 requires the engine to decide deterministically whether a commute is affected.
  Commute.__post_init__ (src/pendel/commute.py) checks only lines and weekdays. A
  delay_threshold_min of -5 reaches evaluate() through app.py and scheduler.py, and
  delay > -300 s is true for every on-time departure, so every ridden departure gets
  flagged: a false positive. A window_end before window_start makes window_bounds()
  an empty range, so the commute is never affected and silently gets no alerts. app.py
  already turns a ValueError from Commute into a 400 form response, so validating
  in the model fixes both the web path and every other caller.'
