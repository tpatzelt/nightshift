title: Footer DE/EN language switch keeps the visitor on the current GET page instead
  of always jumping to '/'
why: 'G2 requires a German and English UI. The footer switch in src/pendel/templates/base.html
  always links to ''/?lang=en'' or ''/?lang=de'', so a visitor who switches language
  on /today, /stops, /notifications, /impressum, /datenschutz or /about is sent back
  to the home page. Every one of those GET routes in app.py already reads ?lang= and
  sets the lang cookie, so the fix is template-only: link to the current path with
  ?lang=. This is a small accessibility/usability fix strictly within G2, so it counts
  as allowed idle work and adds nothing new.'
