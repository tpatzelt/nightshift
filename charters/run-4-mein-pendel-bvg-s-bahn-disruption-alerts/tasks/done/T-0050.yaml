notes:
- Only base.html changes on the source side. Templates are rendered with templates.TemplateResponse(request,
  ...), so `request` is available in base.html.
- 'Compute the switch target in base.html: use request.url.path only when request.method
  == ''GET'' and the path starts with ''/'' but NOT with ''//'' (so a protocol-relative
  link to another host can never be produced); otherwise fall back to ''/''. POST
  responses that re-render a form (e.g. POST /commutes answering 400) must link to
  ''/?lang=..'', because there is no GET /commutes.'
- Drop the existing query string and append only ?lang=en or ?lang=de. Keeping other
  query parameters is out of scope; do not add a helper to app.py (it is protected).
- Keep the existing hreflang and lang attributes and the existing footer_language_switch
  label. Change nothing else in the footer.
- 'Update tests/test_web_language.py: the existing assertions that expect href="/?lang=en"
  on /impressum, /about and /stops must now expect the page''s own path, e.g. href="/about?lang=en";
  ''/'' still expects href="/?lang=en". Add tests: (a) GET /about?lang=en contains
  href="/about?lang=de"; (b) GET /today (no user) links to /today?lang=en; (c) an
  invalid POST /commutes (window_end before window_start, see tests/test_web_commutes.py)
  returns 400 and its switch link is href="/?lang=en"; (d) following the switch link
  on /about sets the lang cookie and renders <html lang="en">.'
- 'Use TestClient(app) without ''with'', as the other web tests do, with PENDEL_DATA_DIR
  set to tmp_path via monkeypatch. Fully offline: no fixture or conftest changes.'
