notes:
- Add tests to tests/test_scheduler.py whose names contain 'dst', so `-k dst` selects
  them (pytest exits 5 if nothing matches). Reuse the existing helpers _insert_commute,
  _insert_channel, _hafas, _load('synthetic_undisturbed.json') and FakeChannel, and
  follow test_commute_due_at_lead_boundary_but_not_one_minute_earlier.
- Weekdays use 0=Monday..6=Sunday. Both 2026 transition days are Sundays, so insert
  commutes with weekdays='6'.
- 'Required cases, with the default 30 min lead: (a) 2026-03-29 (spring forward),
  window 06:00-07:00: no departures request at 05:29 Berlin, exactly one at 05:30
  Berlin. (b) 2026-10-25 (fall back), same window and same assertions. (c) A window
  that starts in the non-existent hour on 2026-03-29 (e.g. 02:30-03:30): assert the
  scheduler does not crash and becomes due at a single well-defined instant consistent
  with commute.window_bounds/_normalise. Assert the instant that window_bounds returns,
  not a hard-coded guess.'
- Build tick instants as timezone-aware Berlin datetimes (zoneinfo), and also check
  one case by passing the same instant in UTC, to prove tick() compares UTC instants.
- Only if a test exposes a real bug in src/pendel/scheduler.py, fix it there with
  the smallest change. Do not edit commute.py. No network, no new fixtures, no new
  dependencies.
