notes:
- Add build_channels(http_client, env) -> dict[str, Channel]. Include 'telegram' only
  if PENDEL_TELEGRAM_BOT_TOKEN is set and 'ntfy' only if PENDEL_NTFY_URL is set. Any
  kind that is not configured maps to a small logging no-op channel that sends nothing,
  so tracker never raises KeyError.
- 'Add main(argv=None) with a --once flag that runs exactly one Scheduler.tick(now)
  and returns. Without the flag it calls run_forever. Use db.connect(), a real HafasClient,
  and the clock dt.datetime.now(BERLIN). Add `if __name__ == ''__main__'': main()`
  so `python -m pendel.runner` works.'
- Tests never call run_forever and never touch the network (conftest.py blocks sockets).
  Inject an httpx.Client(transport=httpx.MockTransport(...)), or monkeypatch the runner's
  client factory with the hafas_replay fixture over tests/fixtures/hafas/scheduler/*.json.
- 'Cover: build_channels with neither, one, or both env vars set; that the no-op channel
  for an unconfigured kind sends nothing and raises nothing; and that main([''--once''])
  with PENDEL_DATA_DIR=tmp_path and one due affected commute plus a linked ''ntfy''
  channel row sends exactly one request to the mocked ntfy transport. The ntfy server
  URL in tests must be a placeholder such as http://ntfy.invalid.'
- Configuration comes only from env vars. Document every var the runner reads in its
  module docstring; G4's .pendel.env.example will list them.
