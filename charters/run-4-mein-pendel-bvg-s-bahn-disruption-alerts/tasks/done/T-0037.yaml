title: 'Compose: telegram poller service, and FORWARDED_ALLOW_IPS so the per-IP limiter
  sees visitor IPs behind Caddy'
why: G4's compose file must run everything the app needs. After T-0036, Telegram linking
  needs a long-running poller process, and compose does not start one. Also, web runs
  behind Caddy, and uvicorn trusts X-Forwarded-For only from 127.0.0.1 by default.
  So request.client.host is always Caddy's container IP, and the per-IP limiter (G5)
  would throttle all visitors together as one client. The deploy files must document
  how to trust only Caddy's network.
