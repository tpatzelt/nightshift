title: Home page links to stop search so a visitor can start saving a commute from
  '/'
why: G2 says a visitor searches stops and saves commutes. But src/pendel/templates/index.html
  links only to /today and /notifications, and has no link to /stops. The only way
  to reach stop search is the empty-state link on /today, so a first-time visitor
  on '/' has no direct way into the save-commute flow. This is a small usability gap
  within G2 and counts as allowed idle work; it adds nothing new.
