notes:
- 'HARD RULE: never send any request to api.telegram.org or any other messaging service.
  Do not create a bot token. Tests use only FakeChannel and hand-made update dicts.'
- create_link(conn, user_id) -> URL. It stores a channels row (kind 'telegram', link_token
  from secrets.token_urlsafe, target NULL) and returns https://t.me/<bot>?start=<token>.
  The bot username comes from env PENDEL_TELEGRAM_BOT_USERNAME. If that is missing,
  raise a clear configuration error.
- 'handle_update(conn, update: dict, channel) takes a Telegram Update-shaped dict.
  If message.text is ''/start <token>'' and the token matches an unlinked row, set
  target=str(chat.id) and linked_at, clear link_token, and send exactly one confirmation
  (DE+EN) to that chat through the injected channel.'
- An unknown, already used or malformed token links nothing. At most one neutral reply
  is sent, and it must not reveal whether the token exists. Tokens are single-use.
- 'End-to-end test with a tmp DB and FakeChannel: create_link, then feed the /start
  update, then check the row is linked and exactly one confirmation was sent. Replaying
  the same update changes nothing and sends no second confirmation. A wrong token
  leaves every row unlinked.'
- Use the db API exactly as it landed in T-0006 and the notify API exactly as it landed
  in T-0024 (which replaces parked T-0007). Read them first. Those files are protected
  in this task.
- "attempt 1: gate failures:\n  - diff appears to contain a hard-coded credential\n\
  \  - diff appears to contain a hard-coded credential"
