title: Reject a zero or negative PENDEL_CHECK_LEAD_MIN at scheduler construction,
  matching the documented 'positive integer' rule
why: deploy/.pendel.env.example documents PENDEL_CHECK_LEAD_MIN as 'Must be a positive
  integer', and ratelimit.rate_limit_per_min_from_env enforces that for its variable.
  scheduler._lead_minutes_from_env accepts 0 or negative values, though. A negative
  lead makes a commute due only after its window has started, which silently breaks
  G3's 'checks each saved commute shortly before its departure window'. Failing loudly
  at startup keeps the scheduler's behaviour predictable.
