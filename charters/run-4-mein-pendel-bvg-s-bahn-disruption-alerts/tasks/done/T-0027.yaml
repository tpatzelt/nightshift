why: 'This covers G3''s definition of done. A test drives the scheduler across a simulated
  morning and asserts three things: exactly one notification per disruption per commute,
  none when the commute is unaffected, and a resolved message when the disruption
  clears. The scheduler must respect the HAFAS rate limit, and it must keep notifying
  other users when one commute or one tick fails. src/pendel/scheduler.py does not
  exist yet, and the parked T-0009 got ''revise'' on attempt 2 only because it lacked
  error isolation.'
