notes:
- 'process(conn, commute_id, verdict, channels, now): diff the verdict''s disruption_key(s)
  against the notifications table. For new keys, send one message (DE+EN reason) and
  insert ''active''. For keys still active, do nothing. For keys that were active
  and are now gone, send one resolved message and mark ''resolved''.'
- 'Test with FakeChannel and a tmp DB: repeated identical verdicts send exactly one
  message; a cleared verdict sends exactly one resolved message; an unaffected verdict
  sends nothing.'
- 'attempt 1: reviewer said revise: The core diff logic is correct and well tested:
  new, repeated, cleared, reactivated and replaced keys all behave as intended, the
  tests assert exact FakeChannel output, and the tests would fail if the change were
  reverted. The change stays within allowed_paths. I checked the actual schema in
  src/pendel/migrations and found two concrete defects to fix before approval.


  (1) Unlinked channels get sent to a None target. In the schema, channels.target
  is nullable, and a Telegram row exists with target NULL and only a link_token until
  the /start deep-link completes. _recipients selects every channel row for the user
  with no filter, so an unlinked Telegram row makes process() call channel.send(None,
  text). Fix: add `AND target IS NOT NULL` to the query (or filter on linked_at for
  telegram). Add a test with an unlinked telegram row (target NULL, link_token set)
  next to a linked ntfy row, and assert that only the ntfy target receives messages.


  (2) resolved_at is never written. The notifications table has a `resolved_at TEXT`
  column. The worker assumed the schema from tests only. When the tracker resolves
  a key it only sets state=''resolved'' and never records `now`. Fix: the UPDATE should
  `SET state=''resolved'', resolved_at=?` with now.isoformat(), and the reactivation
  upsert should reset `resolved_at = NULL`. Extend the cleared and reactivation tests
  to assert resolved_at, so the row''s timestamps stay consistent and deterministic.


  Minor (optional): messages are sent before conn.commit(). If a channel raises partway
  through, the state is not persisted and the next tick will send again. Committing
  each key''s state change right after its send (or documenting the at-least-once
  behaviour) would make this explicit. No secrets, no network access and no new dependencies
  were introduced.'
