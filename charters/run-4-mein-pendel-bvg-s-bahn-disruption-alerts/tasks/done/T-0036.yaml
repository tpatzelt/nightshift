title: 'Telegram update poller: `python -m pendel.telegram_poll` feeds getUpdates
  results into telegram_link.handle_update (offline MockTransport tests)'
why: G3 requires Telegram linking via a /start deep-link token. create_link and handle_update
  exist and are tested against a fake, but nothing in production ever fetches Telegram
  updates and passes them to handle_update. A real user who opens the deep link is
  therefore never linked. This task adds the missing poller. It is tested only through
  httpx.MockTransport and never contacts api.telegram.org.
