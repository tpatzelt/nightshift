title: Visible DE/EN language switch link in the shared footer, so a visitor can change
  the UI language without editing the URL
why: G2 requires a German and English UI. Today the language only comes from ?lang=,
  a lang cookie or Accept-Language (app.py _language_for). No page shows a visible
  switch, so a visitor on a German-language phone cannot reach the English UI, or
  the reverse, without typing a query parameter. The home route already sets the lang
  cookie when ?lang=de|en is given, so linking to it from the footer in base.html
  makes the choice stick across every page.
