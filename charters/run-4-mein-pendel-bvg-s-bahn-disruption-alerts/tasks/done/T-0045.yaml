notes:
- In src/pendel/templates/base.html, add one link to the footer <nav>. For a German
  page (language == 'de') it points to href="/?lang=en" with the label 'English'.
  For an English page it points to href="/?lang=de" with the label 'Deutsch'. Give
  the link a hreflang attribute and a lang attribute naming the target language. Put
  the labels in i18n.py as a new key (for example 'footer_language_switch') in BOTH
  the de and en dicts.
- Do not change app.py. The home route '/' already sets the lang cookie when ?lang=de|en
  is present, and every other page reads that cookie. Linking to '/' instead of the
  current path is a deliberate, conservative choice that keeps the diff small.
- Every template extends base.html and passes 'language' and 't'. Check this rather
  than assume it. If some template overrides the footer block, leave it alone and
  say so in your report.
- Add tests in the new file tests/test_web_language.py using fastapi.testclient.TestClient(pendel.app.app).
  Check that '/', '/impressum', '/about' and '/stops' (no q, so HAFAS is never called)
  contain href="/?lang=en" by default (German), and contain href="/?lang=de" and not
  href="/?lang=en" with ?lang=en. Also check that following the link, client.get('/?lang=en'),
  sets the lang cookie, and that a later GET /about with that cookie renders <html
  lang="en">. Clear client cookies between tests.
- No JS, no new dependency, no fixed widths in CSS (360px layout tests must stay green).
  Tests must stay offline.
