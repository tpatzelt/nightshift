notes:
- Add dependencies jinja2 and uvicorn via `uv add`, and justify them in the commit
  message (the charter prefers jinja2 and needs uvicorn for `uv run uvicorn`). Do
  not add other dependencies.
- 'base.html: <meta name="viewport" content="width=device-width, initial-scale=1">,
  lang attribute, a footer block (legal links come later under G5), small inline or
  static CSS with no fixed px widths above 360, and no JS bundler.'
- Language comes from a ?lang=de|en query/cookie and falls back to Accept-Language,
  default de. Keep the strings in a simple dict in i18n.py.
- GET /healthz returns 200 {"status":"ok"}. GET / renders the base page.
- tests/test_app.py uses TestClient. It asserts the viewport meta and that no HTML/CSS
  contains width:NNNpx with NNN > 360 (a regex over the response and static CSS).
