title: 'Accessibility: announce form and service error messages to screen readers
  (role="alert") and label the footer nav in DE/EN'
why: G2 requires a small mobile-first DE/EN web app. Four error paragraphs (stops.html:21
  for stop search being unavailable, commute_new.html:8 for an invalid commute, and
  notifications.html:23 and :37 for Telegram being unavailable and an invalid ntfy
  topic) are plain <p class="error"> elements, so screen readers do not announce them
  after a failed submit. base.html's footer <nav> has no accessible name. The .error
  class has no style in style.css either, so an error looks like body text. This is
  an accessibility fix strictly within G2, so it counts as allowed idle work and adds
  nothing new.
