title: 'Two-step stop search: after picking an origin, search again and pick the destination
  by name instead of typing a raw HAFAS stop ID'
why: 'G2 says a visitor searches stops and saves commutes. Today the /stops result
  links only prefill origin_stop_id (src/pendel/app.py stops() and templates/stops.html).
  The destination has to be typed as a raw HAFAS ID (''Ziel-Haltestelle (ID)'' in
  i18n.py), so a real visitor cannot save a commute by searching. The fix: carry an
  optional origin_stop_id through /stops, so the second search''s results link to
  /commutes/new with both IDs filled in. It is a small change inside G2 with no new
  route, schema or dependency.'
