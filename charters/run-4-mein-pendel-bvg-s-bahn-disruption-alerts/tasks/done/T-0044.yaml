notes:
- 'GET /stops takes an optional query param origin_stop_id. Without it, behaviour
  and links stay exactly as they are now: /commutes/new?origin_stop_id=<id>. With
  it, every result links to /commutes/new?origin_stop_id=<origin>&destination_stop_id=<id>,
  and the page shows a short DE/EN hint that you are choosing the destination. Add
  the new i18n keys to both the ''de'' and ''en'' dicts.'
- The search form in stops.html keeps origin_stop_id as a hidden input, like the existing
  hidden lang input, so a repeated search stays in destination mode.
- Build hrefs with Jinja's |urlencode filter or urllib.parse.urlencode. Never concatenate
  raw query values. Jinja autoescape must stay on. Add a test showing that an origin_stop_id
  with '&', '"' or '<' cannot inject an attribute or tag.
- 'commute_new.html: when origin_stop_id is set and destination_stop_id is empty,
  show a link to /stops?origin_stop_id=<origin> (''Ziel suchen'' / ''Search destination'').
  Keep the text inputs so typing an ID still works. Do not change POST /commutes or
  its validation.'
- GET /commutes/new already reads destination_stop_id from the query (app.py commutes_new_form).
  Add a test that both IDs are prefilled from the two-step flow.
- Reuse tests/fixtures/hafas/web/synthetic_locations.json with the existing MockTransport
  pattern in tests/test_web_stops.py. Add no fixtures, make no live calls, add no
  dependencies, add no JavaScript.
- Keep the existing 360px structure tests passing (viewport meta, no fixed widths
  above 360px). Do not reformat code you are not changing.
