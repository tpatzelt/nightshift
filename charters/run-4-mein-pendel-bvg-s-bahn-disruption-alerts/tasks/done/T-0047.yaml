title: 'README: document how to run the web app, scheduler runner and Telegram poller
  locally, every PENDEL_* env var, and the offline-fixture test policy, with a test
  that keeps it in sync with deploy/.pendel.env.example'
why: README.md is 11 lines. It only shows `uv sync` and `uv run pytest -q`. An operator
  following G4 cannot learn from it that the app runs as `uv run uvicorn pendel.app:app`,
  that the scheduler is `python -m pendel.runner`, that the poller is `python -m pendel.telegram_poll`,
  or which environment variables exist. The charter requires that configuration comes
  from environment variables documented in `.pendel.env.example`, and a README that
  mirrors that list keeps the documentation truthful. This is documentation within
  G4 and counts as allowed idle work while G1 stays blocked on live recording.
