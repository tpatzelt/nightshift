- 'attempt 1: reviewer said revise: The scope is right: only README.md and tests/test_readme.py
  changed. The test reads deploy/.pendel.env.example and checks every variable in
  it, whether commented or not. It also checks for the three entrypoints and DEPLOY.md,
  and it would fail against the old 11-line README. Most of the README matches the
  code: the defaults 30 and 60 with positive-int validation, the v6.bvg.transport.rest
  default, the ntfy and Telegram no-op behaviour when unset, the poller logging and
  exiting without a token, `--once` and `/healthz`. The task note says ''Do not invent
  defaults or behaviour the code does not have'', and two claims break it.

  (1) The PENDEL_DATA_DIR row says ''the process fails to start without it'', and
  Run locally says it ''must be set for all three''. The code does not do this. db.data_dir()
  reads os.environ[''PENDEL_DATA_DIR''] only when db.connect() is called. In app.py
  that call is in the per-request get_db dependency (app.py:139), and the lifespan
  does not touch the DB. So `uv run uvicorn pendel.app:app` starts and serves /healthz
  without the variable, and fails only on routes that use the DB. telegram_poll.main()
  also returns before db.connect() when PENDEL_TELEGRAM_BOT_TOKEN is unset. Reword
  the row to something the code supports, for example: ''Required, no default. Any
  code path that opens the database raises KeyError if it is unset.'' Also soften
  ''must be set for all three'' to match.

  (2) The Tests section says ''The current fixtures are synthetic (file names start
  with synthetic_)''. tests/fixtures/hafas/harness/example.json does not follow that
  pattern. Either scope the sentence to the engine fixtures, as the task note does,
  or make it accurate for all fixtures.

  Optional nit: the env example says PENDEL_RATE_LIMIT_PER_MIN is ''used once the
  rate limiter lands'', but the limiter already exists (ratelimit.py, app lifespan).
  That is a stale comment in a protected file, so report it as a follow-up and do
  not edit it. No secrets, real domains, LAN IPs or new dependencies were added. The
  only ''Tim''s homelab'' mention matches wording already in the charter.'
