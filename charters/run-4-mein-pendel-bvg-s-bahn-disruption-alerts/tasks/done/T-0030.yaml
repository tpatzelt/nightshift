notes:
- Add GET /notifications to show the cookie user's linked channels (kind + masked
  target, no raw tokens), POST /notifications/telegram to call telegram_link.create_link
  and render the t.me deep link as a plain <a href> (no JS), and POST /notifications/ntfy
  to save a topic as a channels row with kind='ntfy', target=<topic> and linked_at
  set. Parse the form the way POST /commutes does (urllib.parse.parse_qs, because
  python-multipart is not a dependency).
- 'Validate the ntfy topic with ^[A-Za-z0-9_-]{1,64}$. If it is invalid, return 400
  with a DE/EN error and insert no row. If there is no uid cookie or the user is unknown,
  show a hint to save a commute first and create no rows (conservative assumption:
  channels only belong to users who already exist).'
- If PENDEL_TELEGRAM_BOT_USERNAME is unset, catch TelegramLinkConfigError and show
  a friendly DE/EN message with status 503. Never show a traceback.
- Put any new SQL helper (for example add_ntfy_channel, list_channels) in db.py. Do
  not add a migration; the channels table already has the needed columns.
- 'Never contact Telegram or ntfy: these routes only write rows. Add a link to /notifications
  from index.html.'
- 'Tests use TestClient with PENDEL_DATA_DIR set to tmp_path and monkeypatch for the
  env. Cover: the deep link is shown when the env is set and a channels row with a
  link_token exists; 503 when the env is unset; a valid ntfy topic inserts exactly
  one row; an invalid topic gives 400 with no row; no cookie creates no rows; delete-my-data
  (POST /me/delete) also removes these channel rows; the page has viewport meta and
  no fixed width above 360px (reuse the pattern from tests/test_web_today.py).'
