notes:
- Use stdlib sqlite3 only. The migration runner applies src/pendel/migrations/NNNN_*.sql
  in order and records the applied ones in a schema_migrations table.
- 'Tables (minimum): users (opaque random id, created_at; NO email or name), commutes
  (FK users ON DELETE CASCADE, fields matching pendel.commute.Commute), channels (FK
  users, kind ''telegram''|''ntfy'', target, link_token, linked_at), notifications
  (commute_id, disruption_key, state ''active''|''resolved'', first_notified_at, resolved_at;
  UNIQUE(commute_id, disruption_key)).'
- Enable PRAGMA foreign_keys=ON on every connection. Add a delete_user(user_id) helper
  and a test proving no rows remain for that user in any table.
- The DB file path is Path(os.environ['PENDEL_DATA_DIR'])/'pendel.db'. Tests use tmp_path
  via monkeypatch.
