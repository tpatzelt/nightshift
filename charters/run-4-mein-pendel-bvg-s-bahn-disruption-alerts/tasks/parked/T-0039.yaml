title: 'deploy/verify.sh: one script that checks compose config with the example env,
  builds the image, waits for the container''s healthcheck and parses both YAML files,
  and is run by CI before publishing'
why: 'G4''s definition of done needs four checks: `docker build .` succeeds, the container
  answers its healthcheck in a test or script, `docker compose -f deploy/compose.yaml
  config` validates with the example env, and the workflow file is valid YAML. Today
  none of these runs anywhere. tests/test_deploy.py only does stdlib text checks.
  It never parses YAML (PyYAML is not a dependency) and cannot call Docker, because
  the NIGHTSHIFT sandbox blocks the Docker daemon. This task adds one script that
  performs all four checks, runs it in CI on ubuntu-latest (which has Docker) before
  the image is pushed, and documents it in DEPLOY.md so the human can run it too.'
