notes:
- This replaces parked T-0001. No earlier attempt was merged, so start from the current
  tree. The notes below restate the full requirements.
- Use httpx only. Do not add dependencies.
- 'API: locations(query), departures(stop_id, when, duration), journeys(from_id, to_id,
  departure), trip(trip_id). Read the base URL from env PENDEL_HAFAS_BASE_URL, default
  https://v6.bvg.transport.rest. Inject the httpx client.'
- Cache is keyed by path plus sorted params. Its TTL uses an injected clock (a monotonic
  callable), so tests never sleep.
- 'The cache MUST be bounded. Evict expired entries on insert and cap the cache at
  max_entries (default 256), dropping the oldest entry first. Test: 1000 departures
  calls with distinct `when` values leave len(cache) <= max_entries.'
- 'Test: after the TTL passes, an entry is refetched and the stale entry is gone from
  the cache.'
- Backoff on 429/503 uses an injected sleep, exponential delays (0.5, 1, 2 s) and
  at most 3 retries. Honour a numeric Retry-After header, capped at 10 s. After the
  last retry, raise a typed HafasError. Other 4xx/5xx raise at once with no retry.
- 'Harness: an httpx.MockTransport that maps request paths to JSON files under tests/fixtures/hafas/.
  Tiny hand-made JSON is fine here. Real recordings come in T-0002.'
- tests/conftest.py gets an autouse guard that fails any real socket connect. Add
  a test that proves the guard fires.
- Make no live network calls in this task.
