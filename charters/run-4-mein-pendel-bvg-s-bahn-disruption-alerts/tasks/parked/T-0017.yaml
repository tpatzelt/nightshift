notes:
- 'Live-call budget: at most 15 requests in total, at least 1 s apart. Never loop
  over stations. Report the exact count.'
- 'Replacement service: a real departure of a replacement bus for a RAIL line (S-Bahn,
  U-Bahn or tram), for example a line named with SEV or Ersatz, or a remark saying
  Ersatzverkehr or Schienenersatzverkehr on an S/U line. A replacement for a bus line
  does not count.'
- 'Warning: a remark of type ''warning'' whose text or summary describes a real disruption
  (Störung, Einschränkung, Umleitung, Ausfall or similar). Status remarks such as
  ''Additional service'' (text.realtime.journey.additional.service) and hint remarks
  do not count.'
- Prefer verbatim-trimmed. Deriving is allowed only as a minimal edit of a real recorded
  rail departure, using only codes and wording seen verbatim in real responses, and
  it must be labelled 'derived' in the README with the list of changed fields. Never
  invent remark codes.
- test_fixtures_shape.py gets per-kind checks for both files that would have rejected
  the 'Additional service' remark and a bus-line SEV.
- If a kind cannot be found within the budget and cannot be faithfully derived, leave
  that file out, report blocked, and name the missing kind with what you tried. If
  network access is blocked, report blocked with the exact command and its error.
  Never work around the sandbox.
