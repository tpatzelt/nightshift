notes:
- Start from the current tree. Nothing from parked T-0002 was merged.
- 'Live-call budget for this task: at most 20 requests to v6.bvg.transport.rest in
  total, with a sleep of at least 1 s between them. Never loop over stations. Count
  every request, including scratch probes, and report the exact total in your final
  report.'
- The script makes HTTP calls only when given an explicit flag such as --record. `--help`
  and imports must never touch the network. Use httpx, which is already a dependency.
  Add no dependencies.
- 'Trim inside the script: keep a few departures per file and drop unused fields,
  but keep tripId, when, plannedWhen, delay, cancelled, line (id, name, product),
  stop.id, and remarks (type, code, summary, text). Only trim, never rewrite values.
  All four files must be real and verbatim-trimmed. Do not derive any of them.'
- Construction means a remark that really describes Bauarbeiten or construction work
  on the departure's line or stop (the S-Bahn Ring S41/S42 is a good place to look).
  'Additional service' or hint remarks do not count.
- Delay means a departure with delay >= 600 seconds. Undisturbed means a response
  where no departure is cancelled, none is delayed by 5 minutes or more, and no remark
  is of type warning.
- 'tests/fixtures/hafas/README.md lists for each file: request path and params, UTC
  recording time, kind, and ''verbatim-trimmed''.'
- 'tests/test_fixtures_shape.py checks each file parses and has a ''departures'' list,
  and also checks each kind: cancellation has a departure with cancelled true, delay
  has one with delay >= 600, construction has a remark whose text mentions Bau/construction,
  undisturbed has none of these. It also checks that every departures_*.json is listed
  in the README. Tests stay offline.'
- If the sandbox or its guard blocks network access, stop at once and report blocked
  with the exact command and its error output. Do not try other tools or routes to
  get around it. If one kind cannot be found live within the budget, report blocked
  and name the missing kind. Do not invent or derive it.
