title: Render a Selected work section from _data/projects.yml, guarded by a new check
  in scripts/check-site.sh (re-issue of parked T-0014/T-0019)
why: G2's definition of done needs a projects section that renders from a data structure,
  not from copy-pasted markup. index.html has only a hero, About and Contact, and
  there is no _data/ directory yet. T-0014 was close; T-0019 was parked because no
  test file changed. In this repo the test is scripts/check-site.sh, so the new behaviour
  has to be guarded there.
acceptance:
- bash scripts/check-site.sh
- test -f _data/projects.yml
- grep -q 'site.data.projects' index.html
- grep -q 'id="work"' index.html
- grep -q '_data/projects.yml' scripts/check-site.sh
- d=$(mktemp -d) && cp -r . "$d" && rm "$d/_data/projects.yml" && ! bash "$d/scripts/check-site.sh"
- python3 -c "import re;t=open('index.html').read();a=t.index('id=\"about\"');w=t.index('id=\"work\"');c=t.index('id=\"contact\"');assert
  a<w<c"
