notes:
- 'scripts/check-site.sh is this repo''s only test file. Add a new numbered check
  to it as step 11 (steps 1-10 already exist; do not reuse 9). The acceptance commands
  require this: they grep check-site.sh for ''_data/projects.yml'' and run a mktemp
  copy with _data/projects.yml deleted, which must fail.'
- The new check must fail when _data/projects.yml is missing or has no '- title:'
  entry, and when index.html does not loop over site.data.projects. Only add to check-site.sh.
  Never remove or weaken the existing checks.
- Add <section id="work" class="section" aria-labelledby="work-title"> with <h2 id="work-title">Selected
  work</h2> between About and Contact. Each entry is an <article> with an <h3> title.
  Use the same container narrow markup as the other sections.
- 'Entry fields: title and summary are required. year, url and tags are optional,
  and each renders only inside {% if %}, so an empty key never produces an empty element
  (e.g. no empty <ul>). In Liquid an empty array is truthy, so leave optional keys
  out of the placeholders rather than setting them to [] or ''''.'
- Do not invent Tim's projects. Use two clearly-marked placeholder entries, e.g. title
  '[Placeholder project]' and summary '[Placeholder — project description to be supplied
  by Tim]'. Leave out optional keys on the placeholders.
- 'Needed from Tim later (list it in your summary): real project names, one-line descriptions,
  years, and links.'
- Use 2-space YAML indentation. check-site.sh rejects tabs and empty _data files.
- 'Keep the CSS restrained: spacing and type size/weight only, no borders or boxes,
  no new transitions.'
- new_tests_required is false for this task on purpose. T-0010 and T-0019 were parked
  by that gate even though check-site.sh is the test file, and T-0018 passed with
  it set to false. The acceptance commands enforce the regression check instead. Still
  add step 11.
