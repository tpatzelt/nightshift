title: 'Turn the hero into a static typographic statement: drop the typing effect,
  flying cat, status card and joke footer'
why: G1 asks for a page that 'reads as an engineer's professional site rather than
  a landing animation', and the charter asks for 'no continuous ambient animation'.
  The typing effect in main.js, the cat that flies around afterwards (cat-cursor.js/.css)
  and the status-card microcopy make up the landing animation. The hero should be
  a large display h1 name above a quiet role line.
acceptance:
- bash scripts/check-site.sh
- grep -q 'site.author.name' index.html
- grep -q 'site.author.typing_text' index.html
- bash -c '! grep -q "cat-cursor" _layouts/default.html'
- bash -c '! grep -Eq "typing-text|typing-cursor|typing-wrapper|window.typingText"
  index.html'
- bash -c '! grep -Eq "status-card|status-dot|btn-shine" index.html assets/css/style.css'
- bash -c '! grep -Eq "typing-|status-card|\.heart" assets/css/style.css'
- bash -c '! grep -q "main.js" _layouts/default.html || test -f assets/js/main.js'
- test -f assets/js/cat-cursor.js
- test -f assets/css/cat-cursor.css
- bash -c 'd=$(mktemp -d); cp -r . "$d"; echo "<script src=\"/assets/js/cat-cursor.js\"></script>"
  >> "$d/_layouts/default.html"; ! bash "$d/scripts/check-site.sh"'
allowed_paths:
- index.html
- _layouts/default.html
- assets/css/style.css
- assets/js/main.js
- scripts/check-site.sh
protected_paths:
- .github/**
- assets/cv.pdf
- _config.yml
- Gemfile
- Gemfile.lock
- README.md
- assets/js/cat-cursor.js
- assets/css/cat-cursor.css
