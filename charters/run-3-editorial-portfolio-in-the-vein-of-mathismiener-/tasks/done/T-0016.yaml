notes:
- 'Heading check (python3 stdlib): strip Liquid tags from index.html and read the
  <h1>..<h6> levels in source order. The first heading must be h1, and no heading
  may go more than one level deeper than the one before it.'
- 'Focus check: style.css must contain a :focus-visible rule covering at least a,
  button and summary that sets a visible outline (not `outline: none`).'
- 'Reduced-motion check: style.css must contain a `@media (prefers-reduced-motion:
  reduce)` block that sets transition and animation to none (or 0s) and scroll-behavior
  to auto for all elements. If any smooth scrolling is added, gate it behind `prefers-reduced-motion:
  no-preference`.'
- Add checks only; never remove existing ones. Fix the CSS or markup so the gate passes.
