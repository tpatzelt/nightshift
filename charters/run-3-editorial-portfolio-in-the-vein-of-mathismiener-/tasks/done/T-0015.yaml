title: Render the Contact links from _data/contact.yml instead of hand-written markup
why: G2 says 'anything list-shaped' should render from a data structure. The contact/social
  links are a list, currently hand-written as repeated <a> blocks. The handles must
  stay in _config.yml (the charter forbids changing them), so the data file only says
  which links to show and in what order.
acceptance:
- bash scripts/check-site.sh
- test -f _data/contact.yml
- grep -q 'site.data.contact' index.html
- grep -q 'site.author.email' index.html
- grep -q 'site.author.github' index.html
- grep -q 'site.author.linkedin' index.html
- bash -c '! grep -Eq "tpatzelt|tim-patzelt|posteo" _data/contact.yml'
- bash -c 'test $(grep -c "<a " index.html) -le 4'
