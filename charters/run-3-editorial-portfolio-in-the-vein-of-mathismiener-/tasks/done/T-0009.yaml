notes:
- The script is the test for this task, so no separate test file is needed. The negative
  acceptance commands copy the repo to a temp dir, break one rule, and expect the
  script to fail.
- Use `set -euo pipefail` and `cd "$(dirname "$0")/.."` so the script works from any
  cwd, including a copy of the repo.
- Use bash and python3 standard library only. No ruby, jekyll, PyYAML, npm or network
  access.
- 'Checks: (1) index.html, _layouts/default.html, _config.yml, assets/css/style.css
  and assets/cv.pdf exist; (2) there is no package.json at the repo root; (3) _config.yml
  has no top-level `plugins:` or `gems:` key; (4) no `<script src=` pointing to http(s)
  or protocol-relative `//` URLs in index.html, _layouts/*.html or _includes/*.html
  (if present); (5) exactly one `<h1` across index.html, _layouts/*.html and _includes/*.html;
  (6) in each of those files, {% for %}/{% endfor %}, {% if %}/{% endif %}, {% unless
  %}/{% endunless %} and {% case %}/{% endcase %} counts balance; (7) every `''/path''
  | relative_url` reference in those files points to a file that exists; (8) every
  _data/*.yml file (if any) is non-empty and contains no tab characters.'
- 'Print one line per failed check and exit non-zero if any check fails. Print `check-site:
  OK` on success.'
- It must pass on the current tree. Do not edit any site file to make it pass. If
  the current tree fails a check, drop that check and say so in your summary.
- Later tasks may add checks to this script. Checks must never be removed or weakened.
