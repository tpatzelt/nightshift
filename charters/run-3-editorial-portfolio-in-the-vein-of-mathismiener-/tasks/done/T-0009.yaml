why: The charter requires `bash scripts/check-site.sh` to stay green, and G1's definition
  of done depends on it, but the script is missing from the repo, so no task can currently
  pass its gate. The sandbox has bash and python3 (stdlib only, no PyYAML), plus node
  and git. It has no ruby, bundler or jekyll, so the gate has to be a static check
  of the source that uses only these tools.
acceptance:
- test -f scripts/check-site.sh
- bash scripts/check-site.sh
- bash -c 'd=$(mktemp -d); cp -r . "$d"; echo "<h1>x</h1>" >> "$d/index.html"; ! bash
  "$d/scripts/check-site.sh"'
- bash -c 'd=$(mktemp -d); cp -r . "$d"; echo "{}" > "$d/package.json"; ! bash "$d/scripts/check-site.sh"'
- bash -c 'd=$(mktemp -d); cp -r . "$d"; echo "<script src=\"https://cdn.example.com/x.js\"></script>"
  >> "$d/index.html"; ! bash "$d/scripts/check-site.sh"'
- bash -c 'd=$(mktemp -d); cp -r . "$d"; echo "{% if x %}" >> "$d/index.html"; ! bash
  "$d/scripts/check-site.sh"'
