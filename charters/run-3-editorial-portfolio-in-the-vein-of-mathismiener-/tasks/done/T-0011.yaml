id: T-0011
project: tpatzelt.github.io
charter_goal: G1
roadmap_ref: M1
title: 'Switch to a light, neutral theme set in Inter: near-white ground, near-black
  text, one accent'
why: G1 needs the page to load light-themed and typographic. style.css is currently
  a dark theme with three accents and radial gradient washes, and the layout loads
  Space Grotesk and JetBrains Mono. G3 allows no web fonts beyond one family, so Inter
  (variable weight) replaces both.
acceptance:
- bash scripts/check-site.sh
- python3 -c "import re;c=re.search(r'--bg:\s*#([0-9a-fA-F]{6})',open('assets/css/style.css').read()).group(1);assert
  sum(int(c[i:i+2],16) for i in (0,2,4))>=705"
- python3 -c "import re;c=re.search(r'--text-primary:\s*#([0-9a-fA-F]{6})',open('assets/css/style.css').read()).group(1);assert
  sum(int(c[i:i+2],16) for i in (0,2,4))<=180"
- grep -q 'family=Inter' _layouts/default.html
- bash -c '! grep -Eq "Space\+Grotesk|Space Grotesk|JetBrains" _layouts/default.html
  assets/css/style.css assets/css/cat-cursor.css'
- bash -c '! grep -q "radial-gradient" assets/css/style.css'
- bash -c '! grep -q "#0a0b14" _layouts/default.html'
- bash -c 'test $(grep -o "fonts.googleapis.com/css2?[^\"]*" _layouts/default.html
  | grep -o "family=" | wc -l) -eq 1'
