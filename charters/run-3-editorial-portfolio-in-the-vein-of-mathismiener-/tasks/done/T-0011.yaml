notes:
- The acceptance commands are this task's tests. scripts/check-site.sh is not in allowed_paths
  here, so no test file change is expected.
- Keep the token names --bg and --text-primary; the acceptance commands parse them
  as 6-digit hex values.
- Use one restrained accent token (e.g. --accent) and drop the violet/cyan/pink trio
  and the soft rgba variants. Hierarchy should come from size and weight, not colour.
- Load a single Google Fonts family, Inter, with a weight range (e.g. `family=Inter:wght@300..800`).
  Inter Tight is a separate family, so leave it out to stay within 'one family'. Remove
  the other font families from the link and from the CSS stacks (--font-main, --font-mono),
  and use a system monospace stack if any mono is still needed.
- Set theme-color to the new --bg. Recolouring the favicon is optional.
- Update existing rules (name, buttons, status card, footer, focus, selection) so
  text stays readable on the light ground. Do not change markup; the hero restructure
  is T-0012.
