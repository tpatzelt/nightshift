title: Remove the ambient canvas background and the blurred parallax blobs from run
  2 (re-issue of parked T-0010)
why: 'G1''s definition of done says ''the ambient canvas background and the blurred
  parallax blobs from run 2 are gone''. They are still in the code: assets/js/background.js
  draws a fixed #bg-canvas and is loaded by _layouts/default.html; index.html has
  the .floating-shapes/.shape-1..5 markup; style.css has the matching rules (lines
  ~71-135), which are driven by --bg-x/--bg-y/--bg-rot; and main.js sets those variables
  in animateBackground/handlePointerMove/resetBackground. T-0010 did this work but
  was parked twice by the new-test-file gate, not by its acceptance commands, so this
  task sets new_tests_required to false and moves the regression test into negative
  acceptance commands.'
acceptance:
- bash scripts/check-site.sh
- test ! -e assets/js/background.js
- bash -c '! grep -rq "background.js" index.html _layouts'
- bash -c '! grep -q "floating-shapes" index.html assets/css/style.css'
- bash -c '! grep -Eq "\.shape(-[0-9])?\b" assets/css/style.css'
- bash -c '! grep -rq "bg-x\|bg-y\|bg-rot" assets/js assets/css index.html'
- bash -c '! grep -rq "bg-canvas" assets index.html _layouts'
- bash -c 'd=$(mktemp -d); cp -r . "$d"; echo "<script src=\"/assets/js/background.js\"></script>"
  >> "$d/_layouts/default.html"; ! bash "$d/scripts/check-site.sh"'
- bash -c 'd=$(mktemp -d); cp -r . "$d"; echo "<div class=\"floating-shapes\"></div>"
  >> "$d/index.html"; ! bash "$d/scripts/check-site.sh"'
allowed_paths:
- index.html
- _layouts/default.html
