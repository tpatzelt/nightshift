charter_goal: G3
roadmap_ref: M3
title: Make the layout legible without horizontal scrolling at 400px wide
why: 'G3''s definition of done requires no horizontal scrollbar at 400px. Things that
  can overflow a 400px viewport include 100vw widths, fixed pixel widths, min-widths,
  long unbroken strings such as the email address, and a display headline without
  fluid sizing. body currently uses overflow-x: hidden, which masks overflow instead
  of fixing it.'
acceptance:
- bash scripts/check-site.sh
- bash -c '! grep -q "100vw" assets/css/style.css'
- bash -c '! grep -Eq "(^|[^-])(min-)?width:\s*([4-9][0-9]{2}|[0-9]{4,})px" assets/css/style.css'
- grep -q 'overflow-wrap' assets/css/style.css
- grep -q 'clamp(' assets/css/style.css
- bash -c 'd=$(mktemp -d); cp -r . "$d"; echo "main{width:100vw}" >> "$d/assets/css/style.css";
  ! bash "$d/scripts/check-site.sh"'
- bash -c 'd=$(mktemp -d); cp -r . "$d"; echo "main{min-width:960px}" >> "$d/assets/css/style.css";
  ! bash "$d/scripts/check-site.sh"'
