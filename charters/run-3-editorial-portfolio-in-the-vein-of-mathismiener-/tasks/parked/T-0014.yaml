title: Render a Selected work section from _data/projects.yml
why: G2's definition of done requires repeated sections such as projects to render
  from a data structure (_data/*.yml) rather than copy-pasted markup, so adding a
  project means editing data.
acceptance:
- bash scripts/check-site.sh
- test -f _data/projects.yml
- grep -q 'site.data.projects' index.html
- grep -q 'id="work"' index.html
- grep -qi 'placeholder' _data/projects.yml
- bash -c 'test $(grep -c "^- " _data/projects.yml) -ge 2'
- bash -c 'd=$(mktemp -d); cp -r . "$d"; rm "$d/_data/projects.yml"; ! bash "$d/scripts/check-site.sh"'
allowed_paths:
- index.html
- assets/css/style.css
- _data/projects.yml
- scripts/check-site.sh
protected_paths:
- .github/**
- assets/cv.pdf
- _config.yml
- Gemfile
- Gemfile.lock
- README.md
- _layouts/**
- assets/js/**
