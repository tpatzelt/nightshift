title: 'A11y test: every visible form control on the setup, edit and notifications
  pages has an associated label, in DE and EN'
why: G4 requires an accessible design, and 'accessibility' and 'tests' are allowed
  idle work. The forms in commute_new.html, stops.html and notifications.html are
  labelled today, through <label for> or a wrapping <label> inside a fieldset with
  a legend. No test guards this, so a later template edit could leave a checkbox or
  a time input without a label and nothing would catch it. This task only adds a test.
  It adds no feature.
