notes:
- 'Test-only task: add tests to tests/test_web_a11y.py and do not edit any template
  or src file. If a page turns out to have an unlabelled visible control, do not fix
  it here. Mark that one case pytest.mark.xfail with a reason that names the template
  and the control, and report it as a followup.'
- Parse the HTML with the stdlib html.parser.HTMLParser. Do not add a dependency.
  A control is visible if it is input, select or textarea, and an input counts only
  when its type is not hidden, submit or button. A control is labelled if it has an
  id that some <label for=...> on the page references, or if it sits inside an open
  <label> element.
- 'Pages to cover, each with ?lang=de and ?lang=en: GET /stops; GET /stops?q=Alexanderplatz
  with get_hafas_client overridden by a client that returns tests/fixtures/hafas/recorded/locations_alexanderplatz.json;
  GET /commutes/new with origin_stop_id=900100003, origin_name, destination_stop_id=900120003
  and destination_name, with get_hafas_client overridden by the existing _undisturbed_hafas_client
  helper (see test_commutes_new_invalid_window_has_role_alert for get_now and the
  form values); the edit page of a commute you save first via POST /commutes, following
  the existing edit route (look at tests/test_web_commutes.py for the URL and how
  the cookie is set); and GET /notifications with a seeded uid cookie (use _seed_user).'
- Check how HafasClient.locations calls the API in src/pendel/hafas/client.py before
  you build the MockTransport for the locations fixture. The existing autouse fixtures
  _data_dir and _clear_overrides already isolate each test. Everything must stay offline.
- Also assert that each page has at least one checked control, so the test can't pass
  vacuously on an empty page. On /commutes/new and the edit page, also assert the
  checkbox groups sit in a <fieldset> with a non-empty <legend>.
