notes:
- 'Create 0003_commute_paused.sql: ALTER TABLE commutes ADD COLUMN paused INTEGER
  NOT NULL DEFAULT 0. Never edit 0001 or 0002.'
- 'Add db helpers, all scoped by user_id so one visitor can never touch another''s
  commute: get_commute(conn, user_id, commute_id), update_commute(conn, user_id, commute_id,
  commute), set_paused(conn, user_id, commute_id, paused) and delete_commute(conn,
  user_id, commute_id), which returns whether a row was deleted. list_commutes must
  expose the paused flag, e.g. through a `paused: bool = False` field on Commute;
  keep existing callers working.'
- 'The scheduler must skip paused rows, in _all_commute_rows or _due_commute. Test:
  with one paused and one active commute due at the same time, only the active one
  is fetched and notified.'
- 'Migration test: create a DB with only 0001 and 0002, holding a user, a commute
  and a channel. db.connect() must upgrade it without data loss, and paused defaults
  to 0.'
- Test that delete_commute removes exactly one commute and leaves the user's other
  commutes and other users' commutes.
- 'attempt 1: reviewer said revise: The production code is correct and stays in scope.
  Migration 0003 is additive and 0001/0002 are untouched. Every helper filters on
  id AND user_id and returns rowcount > 0. update_commute serialises fields the same
  way add_commute does. _all_commute_rows filters WHERE paused = 0, and it is the
  scheduler''s only commute query. Two tests fall short of what the task notes ask
  for:


  1. The migration test must use a database holding a user, a commute and a channel.
  test_migration_0003_upgrades_existing_database_without_data_loss creates no channel
  and never checks that the user or channel survive; it only checks origin_stop_id
  and paused. Fix: call _insert_channel(old_conn, user_id) before closing. After db.connect(),
  assert the user row, the channel row (kind/target) and the commute''s full fields
  (destination, lines, weekdays, window, names) are unchanged, and that paused ==
  0.


  2. The task asks to show that only the active commute is fetched. In test_paused_commute_is_skipped_while_active_commute_due_at_the_same_time_is_fetched
  both commutes use origin_stop_id=''900000100001''. The scheduler merges commutes
  at the same stop into one request (see test_two_commutes_same_stop_different_windows_cause_a_single_departures_request),
  so `assert len(calls) == 1` still passes with the paused filter reverted. Only the
  notification-count assertion actually tests the change. Fix: give the paused commute
  a different origin (e.g. ''900000900009'') and assert that stop is never requested,
  e.g. that no call''s path contains the paused stop ID and exactly one departures
  call is made for the active stop.


  Minor, optional: in test_update_commute_overwrites_fields_and_is_scoped_to_owner,
  check right after the other user''s rejected update that the owner''s row is still
  the original. Also assert that weekdays, window and paused round-trip.


  Assumptions accepted: add_commute storing paused, and update_commute overwriting
  every field, are both reasonable and consistent.'
