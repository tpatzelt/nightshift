notes:
- No service worker and no Web Push (charter non-goals). Only a manifest and icons.
- 'manifest.json: name ''Mein Pendel'', short_name ''Pendel'', start_url ''/today'',
  scope ''/'', display ''standalone'', background_color and theme_color, icons 192x192
  and 512x512 image/png (purpose ''any''). Serve it through the existing /static mount.
  The .json suffix makes StaticFiles send application/json.'
- Generate the PNGs once with stdlib only (zlib + struct), e.g. a solid square with
  a simple mark. Commit only the resulting files, not a generator script. No new dependency.
- 'base.html <head>: <link rel="manifest" href="{{ url_for(''static'', path=''manifest.json'')
  }}">, <link rel="apple-touch-icon" href="…icons/icon-192.png">, <meta name="theme-color"
  …>. Do not change anything else in base.html.'
- 'tests/test_design.py: GET /, /stops, /today, /notifications, /about, /impressum
  and /datenschutz with TestClient (PENDEL_DATA_DIR on tmp_path, as in tests/test_web_a11y.py;
  override get_hafas_client so nothing touches the network) and assert each links
  rel="manifest". GET the manifest URL returns 200 with valid JSON. Each icon listed
  exists, and its PNG IHDR width/height match its ''sizes''.'
