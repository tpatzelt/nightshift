notes:
- Add POST /commutes/{commute_id}/pause, /commutes/{commute_id}/resume and /commutes/{commute_id}/delete.
  Each is scoped to the uid cookie's user via db.set_paused / db.delete_commute and
  redirects 303 to /commutes. An unknown id, another user's id or a missing cookie
  changes nothing (404 or a redirect is fine, but never touch another user's rows).
- Parse the body with urllib.parse like POST /commutes does. python-multipart is not
  a dependency.
- 'On commutes.html, each commute gets plain <form method=post> buttons: ''Pausieren''/''Pause''
  or ''Fortsetzen''/''Resume'', and ''Löschen''/''Delete''. Each button''s text or
  aria-label names the commute (origin → destination) so screen readers can tell them
  apart. No JavaScript is required.'
- 'Tests: with three commutes, deleting one leaves the other two (in the DB and on
  the page). Pause, then resume, flips the paused flag and the page''s Paused label.
  Another user''s commute cannot be paused or deleted. DE+EN labels. Keep the 360px
  layout test passing.'
