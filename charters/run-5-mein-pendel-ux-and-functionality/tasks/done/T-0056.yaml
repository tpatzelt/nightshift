  wording (''Gleis 3 statt 1'') is only tested against a synthetic payload (tests/test_web_today.py
  test_today_platform_change_shown_as_text). None of the recorded fixtures has a departure
  where platform differs from plannedPlatform: the six departures_*.json files have
  their platform fields trimmed away, and platforms_ostkreuz.json has no change. The
  charter''s allowed idle work includes ''recorded fixtures of further real disruption
  kinds'' and says to prefer real recorded fixtures. This task adds one fixture and
  the tests for it. It adds no feature.'
acceptance:
- test -f tests/fixtures/hafas/recorded/departures_platform_change.json
- uv run python -c "import json; d=json.load(open('tests/fixtures/hafas/recorded/departures_platform_change.json'))['departures'];
  assert any(x.get('platform') and x.get('plannedPlatform') and x['platform'] != x['plannedPlatform']
  for x in d)"
- grep -q departures_platform_change.json tests/fixtures/hafas/recorded/README.md
- uv run pytest -q tests/test_engine_recorded.py tests/test_web_today.py
- uv run pytest -q
