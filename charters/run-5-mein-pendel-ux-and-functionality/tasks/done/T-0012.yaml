notes:
- One card (<article> or <li>) per commute, headed 'origin_name → destination_name'.
  For an old commute with empty names, show a localized generic label (DE+EN, e.g.
  'Gespeicherte Verbindung' / 'Saved commute'). Never render a stop ID anywhere in
  the page, including attributes.
- 'Status values and CSS classes: status-ok, status-disrupted, status-paused, status-failed,
  plus the existing status-inactive for ''not active today''. Every status element
  carries visible localized text (e.g. ''OK'', ''Gestört'' / ''Disrupted'', ''Pausiert''
  / ''Paused'', ''Prüfung fehlgeschlagen'' / ''Checking failed'') and a decorative
  aria-hidden icon character. Never convey status by class or color alone.'
- 'Paused commutes: status paused, and their origin is never fetched (a paused-only
  user makes zero HAFAS calls). The HafasError path becomes status failed.'
- The reason stays in the UI language only (verdict.reason_de or reason_en).
- 'Tests: one page with an OK, a disrupted, a paused and a failed commute (use recorded
  fixtures, e.g. departures_undisturbed.json and departures_warning.json, and a failing
  client for another origin). Assert the stop names appear, none of the 9-digit IDs
  appear, each status label text appears, and the paused origin is not requested.
  Keep the 360px layout test passing.'
- Do not add next departures or alternatives yet (T-0013, T-0014).
