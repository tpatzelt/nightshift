notes:
- 'Add fields with defaults so existing Verdict(...) constructions elsewhere keep
  working: line: str = '''' and planned: datetime | None = None. They describe the
  primary (highest-priority) event. planned is the Berlin-aware plannedWhen of the
  departure that produced it. Unaffected verdicts keep ''''/None.'
- Carry planned on _Event (default None), set it in _departure_disruption_events from
  the departure being evaluated, and copy it onto the Verdict.
- 'Tests: a synthetic cancellation and delay give the right line and planned time.
  An unaffected verdict has line '''' and planned None. The recorded departures_warning.json
  still evaluates. dataclasses.replace(verdict, reason_de=...) (used by the scheduler)
  keeps line and planned.'
- 'attempt 1: reviewer said revise: The engine change is correct and minimal. Verdict
  gains line='''' and planned=None as defaults. _Event carries planned, and it is
  set for the cancellation, delay and remark events from the departure''s plannedWhen
  converted to Berlin time. The primary event''s values are copied onto the Verdict.
  Diff size and paths are within limits and all gates pass. The new tests would fail
  if the change were reverted. But the task''s test notes are only partly done, so
  please add these to tests/test_engine.py: (1) The task asks for a test that dataclasses.replace(verdict,
  reason_de=...), which scheduler.py:198 uses, keeps line and planned. No such test
  exists. Add one that builds an affected verdict, calls dataclasses.replace(verdict,
  reason_de=''x'') and asserts line and planned are unchanged. (2) The remark path
  (warning, replacement_service) now also passes planned, but no test checks it. Add
  an assertion that a remark-only event, such as synthetic_warning.json or _departures(remarks=[{type:
  ''warning'', ...}]), gives line ''S41'' and the expected Berlin planned time. (3)
  Optional but useful: the task says departures_warning.json still evaluates. Existing
  recorded tests already cover that, but a line/planned assertion on the recorded
  RB32 warning case would show the field works on real HAFAS data. The worker''s assumption
  (astimezone(BERLIN) on the tz-aware plannedWhen) is sound.'
