notes:
- window_end < window_start means the window ends on the next calendar day. Weekdays
  refer to the day the window starts. window_end == window_start stays allowed as
  today.
- window_bounds(date) returns the end on date+1 for a crossing window, normalised
  as today. Add window_containing(now) -> (start, end) | None, which checks the window
  starting today and the one that started yesterday (if yesterday was active). Compare
  as UTC instants, as next_window_start does.
- 'DST tests: 2026-10-24 (Sat) 23:30-02:30 across the 2026-10-25 fall-back is 4 real
  hours. 2027-03-27 (Sat) 23:30-02:30 across the 2027-03-28 spring-forward ends at
  03:30+02:00. Test window_containing at 00:15 the next day, and at 02:30 in both
  folds of the fall-back night.'
