title: Assert that an unwritable notification ledger neither breaks delivery nor lets
  the same notifier resend a posting
why: 'G3''s definition of done requires that ''a job already notified is provably
  not notified again''. tests/test_notify_ledger.py covers resend across runs, failed
  sends, a corrupt ledger on read, duplicates within one call, no ledger, and canonical
  URLs. No test covers the write-failure branch of TelegramNotifier._save_ledger (src/notifier.py):
  grep for ''Could not write'', OSError or _save_ledger in tests/ finds nothing. I
  checked the current behaviour on a scratch copy at HEAD 2046f15. With ledger_path=<tmp>/blocker/notified.json,
  where ''blocker'' is a regular file, the first notify_results call logs ''Could
  not write notification ledger ... File exists'', returns True and sends 1 message.
  A second notify_results call on the same instance with the same URL returns True
  and sends nothing more, because _mark_notified updates the in-memory set before
  saving. This behaviour is correct, but nothing pins it, so a refactor could make
  a disk error raise out of a scan or cause a resend. At HEAD 2046f15, pytest gives
  384 passed and 1 skipped, and offline_eval scores 1.000 on every metric. This is
  test-only idle work strictly within G3.'
