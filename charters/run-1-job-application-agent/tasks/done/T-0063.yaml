title: Pin the achieved corpus totals in a test so a regression that still beats the
  arming baseline fails the default suite (re-issue of planned T-0062, which never
  reached the backlog)
why: 'G2''s definition of done requires that no metric regresses. Today the only guard
  is `--check-baseline` against evals/baseline.json, which holds the weak arming numbers
  (posting_shape 0.815, aggregator_drop 0.765, location 1.0, staleness 0.429, dedup
  0.571). A change to src/url_heuristics.py, src/page_signals.py or the triage/dedup
  paths could therefore drop posting_shape_rate from 1.000 to 0.85 and every gate
  would stay green. I verified on a scratch copy at HEAD 638ad58 that `run(DEFAULT_CORPUS_DIR)[''totals'']`
  is {''records'': 58, ''kept'': 16, ''metrics'': {''posting_shape_rate'': 1.0, ''aggregator_drop_rate'':
  1.0, ''location_match_rate'': 1.0, ''staleness_detection_rate'': 1.0, ''dedup_rate'':
  1.0}}. I also checked that no test in tests/ asserts these achieved values: tests/test_offline_baseline.py
  only compares against the baseline file or against inflated copies of the current
  totals. `uv run pytest -q` gives 383 passed, 1 skipped. This is test-only idle work
  strictly within G1/G2.'
