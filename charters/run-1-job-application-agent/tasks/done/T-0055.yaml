title: Assert the exact unreadable-document, failed-download and 'please upload' replies
  of _document_or_text in every intake state (re-issue of planned T-0054, which never
  reached the backlog)
why: 'The previous planner pass (decision 20260924-040729) planned T-0054 for this
  gap, but T-0054 is not in /plan/backlog, done or parked, so it never reached the
  backlog. I checked the gap again against the read-only HEAD 8417268 and it is still
  open. src/intake.py:312-329 `_document_or_text` produces three user-visible replies.
  (1) `"⚠️ {exc}\n\nPlease try another file."` when extract_text raises DocumentExtractionError.
  (2) The same text when download_document raises TelegramError. (3) `"Please upload
  a document (PDF, DOCX, or text file) or paste the content as a message."` for short
  or empty text. These replies reach the user from the CV state (src/intake.py:155),
  the motivation state (:166) and the job-prefs state (:176). tests/test_intake.py
  checks them only loosely: test_bad_document_reports_error_and_keeps_state (:203)
  asserts only that ''⚠'' is present, test_short_text_in_cv_state_is_rejected (:162)
  asserts only a lowercase substring, and neither path is tested in the motivation
  or job-prefs states. No test anywhere contains ''Please try another file''. The
  G3 definition of done requires a content-asserting test for every user-visible message
  path. The other paths are already covered: the Why: line, the ledger, the scan-error,
  notify-failed and missing-profile texts, and the bot_service replies.'
