why: 'G3''s definition of done says that ''an error during a scan produces a message
  naming what failed'' and that every message path has a test asserting its content.
  The tests of _format_scan_error in tests/test_bot_service.py (lines 84-120), and
  the send-boundary tests at lines 122 and 177, check only fragments. No test pins
  the full sentence. No test covers the branch where str(exc) is empty and only the
  type name is shown. The truncation test checks only the length and never the ''…''
  marker. I checked on a scratch copy at HEAD 5c1055a. _format_scan_error(ValueError(''Brave
  API returned 503'')) returns "⚠️ The job scan hit an error (ValueError: Brave API
  returned 503). I''ll try again at the next scheduled run - you can also send /run
  to retry sooner." _format_scan_error(TimeoutError()) returns "⚠️ The job scan hit
  an error (TimeoutError). I''ll try again at the next scheduled run - you can also
  send /run to retry sooner." _format_scan_error(RuntimeError(''x''*5000)) returns
  430 characters: the prefix, then 300 ''x'' characters, then ''…). I''ll try again
  ...''. Tests only, strictly within G3.'
