title: Canonicalise host, scheme and query order so duplicates collapse (supersedes
  parked T-0023)
why: 'canonical_url (src/url_heuristics.py:74) drops the fragment, tracking params
  and an /apply suffix and lowercases the host, but keeps the scheme, the www. prefix
  and the original query order, so http://www.x.com/jobs/1 and https://x.com/jobs/1?a=1&b=2
  vs ?b=2&a=1 are three cache keys for one posting - the same job is fetched, scored
  and notified more than once. Headroom is verified, not assumed: replaying evals/fixtures
  today, three of the four labelled duplicate pairs collapse and the failing one is
  exactly https://www.jobs.lever.co/brightloop/<uuid> against http://jobs.lever.co/brightloop/<uuid>,
  which is why dedup_rate sits at 0.750 - unchanged under T-0026''s posting-only semantics,
  which is why this task needs no dependency. Re-issues parked T-0023, which had been
  gated behind a parked task since its creation.'
