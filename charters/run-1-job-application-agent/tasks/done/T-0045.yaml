  the document-error reply, the too-short-paste reply and the question texts. These
  replies are sent to users but nothing asserts their content: the ''✅ Motivation
  letter received.'' reply plus the job-prefs prompt (src/intake.py:165, :337), the
  job-prefs prompt after /skip (:160), ''Please answer in a short text message.''
  (:181), the ACTIVE-state chat reply (:193), the /start reply when already ACTIVE
  (:127), the ''I need a bit more information.'' lead-in (:216), the ''❓ (N question(s)
  left)'' counter and its singular/plural wording (:333), and the _prompt_for_state
  motivation/fallback prompts shown through /status and /start (:348-354). The last
  planner pass planned this as T-0044, but it never appeared in /plan/backlog, so
  it is re-issued here unchanged in scope.'
