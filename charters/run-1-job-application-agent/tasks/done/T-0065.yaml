title: Assert the exact full text of a job notification message, including the ' @
  company' suffix and the entry layout
why: 'G3''s definition of done requires that every user-visible message path has a
  test asserting its content. The job notification is the main message the bot sends,
  but tests/test_notifier.py and tests/test_notify_ledger.py only check it with substring
  checks (''2 new job(s)'', ''Score: 85'', the URL, the ''Why:'' line). I grepped
  tests/ for '' @ '' and for the 💼 header: no test covers the company suffix that
  TelegramNotifier._format_result adds when company != ''Unknown'', and no test pins
  the order of the lines or the blank line between entries. Every test helper uses
  company=''Unknown''. I ran this on a scratch copy at HEAD 5c1055a with requests.post
  patched: notify_results([JobResult(title=''Software Engineer'', company=''Acme'',
  url=''https://x.io/1'', score=85, reason=''good match'', status=''new''), JobResult(title=''Data
  Engineer'', company=''Unknown'', url=''https://x.io/2'', score=70, reason='''',
  status=''new'')]) sends exactly one message, whose text is ''\U0001f4bc 2 new job(s)
  found:\n\n1. Software Engineer @ Acme\nScore: 85\nWhy: good match\nhttps://x.io/1\n\n2.
  Data Engineer\nScore: 70\nWhy: scored 70; the evaluator gave no explanation\nhttps://x.io/2''.
  The current behaviour is correct, but nothing pins it. Tests only, strictly within
  G3. At this HEAD, pytest gives 385 passed and 1 skipped, and offline_eval scores
  1.000 on every metric.'
