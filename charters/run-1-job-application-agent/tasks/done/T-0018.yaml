title: Re-derive the arming baseline by replaying the corpus against the arming revision
  (supersedes parked T-0011)
why: 'G2''s definition of done demands improvement on aggregator-drop rate, but evals/baseline.json
  records it at 1.000 over today''s 23 records, so the improvement is arithmetically
  impossible until the corpus grows - and growing the corpus silently invalidates
  a baseline frozen against the old corpus. The only honest fix is to recompute the
  baseline from the ARMING revision''s src on whatever corpus the harness replays,
  which needs a tool. I verified the gap is real and recoverable: git in /repo resolves
  origin/main to b6da8dd (the arming commit) and HEAD to 758f6d8, and `git diff --stat
  b6da8dd..HEAD -- src/` shows exactly one changed file, src/url_heuristics.py (+71/-2,
  T-0006''s aggregator widening). T-0011 carried this work, was reviewed twice as
  ''the tool itself is correct'', failed both times on test coverage, and its diff
  is absent from the tree (there is no evals/rebaseline.py). This re-issues it with
  the tests enumerated so the same gap cannot recur. T-0011 stays parked and must
  not be revived.'
