title: 'README: describe what a job notification now says, that it is never repeated,
  and what the user is told when delivery or a scan fails'
why: 'This is idle work the charter allows: documentation strictly within G3. The
  planner checked on 2026-09-23. All three definitions of done are met. `uv run python
  -m evals.offline_eval --check-baseline` exits 0 with every TOTAL metric at 1.000
  against the arming baseline (posting_shape 0.815, aggregator_drop 0.765, staleness
  0.429, dedup 0.571), and nothing regressed. `uv run pytest -q` gives 362 passed,
  1 skipped. run_mock_test.py passes. But the user-facing README section ''Telegram
  notifications'' (README.md:103-108) still describes the pre-G3 output: it says every
  run sends ''the newly accepted jobs (title, score, URL)''. It does not mention three
  things. (1) Each entry carries a ''Why:'' line, with a fallback when the evaluator
  gave no reason (T-0046, src/notifier.py _format_result). (2) A durable ledger `notified.json`,
  stored next to the seen-URL cache, means a posting is never notified twice, including
  across restarts and within one results list (T-0024, T-0035; src/main.py:47, src/bot_service.py
  _run_scan). (3) The bot sends a warning naming the failure when a scan raises (_format_scan_error),
  and a message when Telegram delivery of job notifications fails (notify_failed,
  T-0049). Operators reading the README cannot learn any of this today.'
