notes:
- Extend STALE_PHRASES with wordings the current list misses, English and German,
  e.g. 'we are no longer accepting applications for this', 'this position has been
  closed', 'this role is no longer open', 'the job you selected is no longer available',
  'diese stelle ist nicht mehr ausgeschrieben', 'diese position ist nicht mehr verfügbar',
  'die stellenanzeige wurde entfernt', 'diese anzeige ist nicht mehr aktiv'. Every
  phrase must be specific enough that a live posting cannot contain it - a bare '404'
  or 'expired' would fire on live pages that mention an expiring benefit or a 404
  link in a footer, and the resulting false positives will show up as a location_match_rate
  or posting_shape_rate regression under --check-baseline. Keep matching on the whitespace-normalised
  lowercase text via the existing _normalize. Add one assertion per added phrase plus
  a negative test that a normal live posting mentioning 'application deadline' is
  not marked stale. Do not change LOCATION_ALIASES, COUNTRY_CODES or mentions_location
  in this task.
