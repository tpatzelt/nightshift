title: Every job message says why it matched, even when the evaluator's reason is
  blank
why: 'G3 requires job messages that state why a job matched. TelegramNotifier._format_result
  (src/notifier.py:112-120) adds a ''Why:'' line only when result.reason is non-empty
  after strip(). JobResult.reason comes from evaluation.reason (src/orchestrator.py:507).
  src/llm_service.py only checks that the ''reason'' key is present, so an evaluator
  reply of "reason": "" or whitespace passes through. The job is then sent with a
  score and a URL but no explanation. tests/test_notifier.py:121 (test_notify_empty_reason_produces_no_blank_line)
  currently asserts that behaviour (''Why:'' not in entry). I confirmed on 2026-09-23
  that the other G3 items are covered: repeat notifications (T-0024, T-0035), scan-error
  text (T-0032) and send-boundary content (T-0033, T-0034, T-0045). This gap is the
  last one I could find in G3''s ''state why a job matched''.'
