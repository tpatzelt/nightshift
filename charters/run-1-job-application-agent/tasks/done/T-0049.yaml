title: Tell the user when a scan's job notifications fail to deliver instead of staying
  silent (re-issue of parked T-0048, with shell-runnable acceptance)
why: 'G3 requires that an error during a scan produce a message naming what failed.
  At HEAD fc06634, src/orchestrator.py:277-283 `_notify` ignores the False that TelegramNotifier.notify_results
  (src/notifier.py:76) returns when a send fails, and it logs and swallows any exception.
  src/bot_service.py:315 `_run_scan` only messages the user when `results` is empty.
  So when accepted jobs cannot be delivered, the scan ends and the user hears nothing.
  This is the last confirmed silent-failure path in M3. T-0048 described the same
  work but was parked twice without a worker attempt: the gate runs every acceptance
  entry as a shell command, and its prose acceptance entries failed as bash. This
  re-issue keeps acceptance to commands only and moves the behaviour spec into notes.'
