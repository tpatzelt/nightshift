title: 'Score results, not hub pages: make the harness sensitive to posting-vs-listing
  (supersedes parked T-0019)'
why: 'evals/offline_eval.py:60 replay_keep drops only OTHER URLs and aggregator INDEX
  pages, so a LISTING or non-aggregator INDEX record counts as kept. Production does
  the opposite: src/orchestrator.py:406 harvests posting links out of any non-POSTING
  page and returns without scoring it, so a careers/board hub never becomes a JobResult.
  Until kept models ''what becomes a reported result'', reclassifying a vendor board
  root from POSTING to LISTING moves no metric at all, and the two G2 url_heuristics
  tasks are arithmetically unable to move posting_shape_rate - the metric the charter
  names as must-improve. Re-issues parked T-0019, whose two attempts both died on
  the same unrepaired defect in its own task file: the change breaks tests/test_offline_baseline.py,
  which was not in its allowed_paths (attempt 1 was gated for exactly that; attempt
  2 reported blocked). That file is in scope here. I verified the whole task is otherwise
  executable in a writable copy of the tree: the one-line gate produces the numbers
  below, `python -m evals.rebaseline` resolves origin/main to b6da8dd and re-freezes
  cleanly, and the suite returns to green once three named tests are updated.'
