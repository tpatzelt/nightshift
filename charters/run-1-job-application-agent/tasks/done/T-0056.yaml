title: Name the failures in the 'no new matching jobs' message when the scan's RunReport
  recorded errors
why: 'Verified at read-only HEAD 7e87c91. RunReport.record_error (src/run_report.py:61)
  counts failures as `error_<kind>` counters: error_query_generation_failed (src/orchestrator.py:156),
  error_fetch_failed (:431) and error_evaluate_failed (:482). _empty_scan_explanation
  (src/bot_service.py:33-54) only reads counters that start with `skipped_` or `rejected_`,
  so it ignores all of these. If OpenRouter fails during query generation, nothing
  is searched or fetched, and the user is told ''Scan finished - no new matching jobs
  this time... I could not fetch any job pages this run.'' That message says nothing
  about the LLM failure. If every fetch raises, the user is told ''I could not fetch
  any job pages'' with no cause. The G3 definition of done says ''an error during
  a scan produces a message naming what failed'', and these swallowed errors never
  reach the scan-error path (_format_scan_error), because the orchestrator catches
  them.'
