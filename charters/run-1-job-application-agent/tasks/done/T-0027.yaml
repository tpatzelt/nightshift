title: Extend the labelled corpus with the URL shapes the code actually gets wrong,
  then re-freeze the baseline (supersedes parked T-0020)
why: 'The corpus is 23 records and every metric except dedup_rate is already saturated
  at the arming revision. I replayed it today to be sure: with T-0026''s posting-only
  kept semantics, ARMING src scores posting_shape 1.000, aggregator_drop 1.000, location_match
  1.000, staleness 1.000, dedup 0.750. G2''s definition of done requires improvement
  on posting-shape rate AND aggregator-drop rate, so on this corpus G2 is arithmetically
  impossible to demonstrate, and T-0006''s aggregator widening provably moved nothing.
  The harness can only measure quality if the corpus contains the shapes the deterministic
  logic gets wrong. Re-issues parked T-0020, which was gated on parked T-0019.'
