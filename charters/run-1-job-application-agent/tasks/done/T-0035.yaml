title: TelegramNotifier never repeats a posting that appears twice in one results
  list
why: Idle work within G3 (its goals are met). The charter's G3 definition of done
  says 'a job already notified is provably not notified again'. At the notifier boundary
  this holds only across runs, through the ledger. In TelegramNotifier.notify_results
  (src/notifier.py:76), `pending` filters against self._notified but is not deduplicated
  within the call. So results=[JobResult(url='https://jobs.lever.co/a/1'), JobResult(url='http://www.jobs.lever.co/a/1')]
  sends the same posting twice in one message, and the header says '2 new job(s)'.
  Today only the upstream seen_urls handling in src/orchestrator.py prevents this.
  The notifier should guarantee it itself, so the proof does not depend on another
  module.
