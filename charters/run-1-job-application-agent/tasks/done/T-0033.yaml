  Then add one send-boundary test showing that _run_scan''s no-new-jobs message starts
  with ''\U0001f50d Scan finished - no new matching jobs this time.'' and ends with
  the explanation line. For that test, monkeypatch src.bot_service.Orchestrator, LLMService
  and CrawlerEngine with fakes: the fake Orchestrator''s run() returns [] and exposes
  last_report.'
- In your output, map each of (a), (b) and (c) to the test names that assert it.
- No network, no real sleep, no dependence on TELEGRAM_BOT_TOKEN.
