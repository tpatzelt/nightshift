title: Assert the exact text of the setup-complete 'You're all set!' reply, including
  the parameter summary and the scan schedule
why: 'G3''s definition of done needs a test asserting the content of every user-visible
  message path. IntakeManager._finalize (src/intake.py, the ''\U0001f389 You''re all
  set!'' return) is the reply that finishes onboarding. It is the last intake path
  whose content is still unasserted. tests/test_intake.py checks only `"all set" in
  reply` (test_full_intake_happy_path, test_extraction_failure_falls_back_to_answers).
  No test contains ''every morning around'', ''You''re all set!'' or ''Use /run to
  start''. So a regression in _format_schedule, a lost Roles/Locations/Language line
  or dropped /run, /status and /reset hints would pass unnoticed. I verified today''s
  output in a scratch copy of the tree. With the COMPLETE extraction and the default
  scan_hour=7 and scan_timezone=''UTC'' it is: "\U0001f389 You''re all set!\n\n\U0001f3af
  Roles: Project Manager\n\U0001f4cd Locations: Berlin, Germany\n\U0001f511 Keywords:
  digital transformation\n\U0001f3ed Industries: public sector\n\U0001f310 Language:
  English\n\nI''ll scan for matching jobs every morning around 07:00 (UTC) and message
  you when I find new ones. Use /run to start a scan right now, /status to check your
  setup, or /reset to change your documents." G1 and G2 are met: the offline harness
  scores 1.000 on every metric against the arming baseline, and pytest gives 382 passed,
  1 skipped. This is tests-only work strictly within G3.'
