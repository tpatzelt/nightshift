why: 'Orchestrator._notify (src/orchestrator.py:272) discards the bool notify_results
  returns, and the seen-URL cache is saved at :230 before notification happens at
  :243, so a posting whose send failed is marked seen and never re-sent, while a lost
  or re-keyed cache announces the same posting again. G3''s definition of done requires
  that a job already notified is provably not notified again. Re-issues parked T-0015
  with depends_on cleared: its real dependencies T-0010 and T-0016 are merged, and
  the dependency on T-0008 was an ordering preference that left a G3 definition-of-done
  item hostage to a G2 chain which has now stalled twice.'
