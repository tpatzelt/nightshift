notes:
- 'Keep the ledger inside TelegramNotifier so the fix stays in the modules G3 names:
  an optional ledger_path constructor argument, default None meaning today''s behaviour
  exactly. notify_results filters out results whose canonical_url is already in the
  ledger, and records a URL only after its message actually sent (the bool from _send)
  — so a Telegram outage leaves the job unnotified and retryable rather than silently
  swallowed. Note that _build_messages batches several results into one message: a
  URL may only be recorded if the message that carried it sent, so map entries to
  their message before recording.'
- 'Wire it at the two construction sites, both re-checked in the tree today: src/bot_service.py:296
  constructs the notifier and src/bot_service.py:299 computes `paths = self._store.crawl_paths(chat_id)`
  just after it — move that lookup above the construction and derive the ledger path
  as paths[''cache_path''].parent / ''notified.json''. Do not add a key to user_store.crawl_paths
  (src/user_store.py is protected). src/main.py:43 constructs the other one; put the
  ledger next to root / config.cache_path.'
- Store JSON; create on demand; an unreadable, corrupt or non-JSON ledger logs a warning
  and reads as empty, never raises — a notifier failure must not break a crawl. Use
  src.url_heuristics.canonical_url for the key so the ledger and the cache agree;
  when T-0023 lands, existing ledger keys stop matching and a posting notified before
  it may be announced once more. That is the same one-time, self-healing effect T-0023
  accepts for cache.json; say so in the task output.
- 'Tests: two runs over the same result notify once; a result whose send returned
  False is not recorded and IS re-sent on the next run; a corrupt ledger file degrades
  to empty without raising; a ledger_path of None preserves today''s behaviour; the
  ''Why:'' reason line added by T-0010 still appears. No live Telegram call and no
  network — monkeypatch requests.post as tests/test_notifier.py already does. TELEGRAM_BOT_TOKEN
  is deliberately absent from the sandbox and must stay that way.'
