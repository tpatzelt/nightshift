notes:
- Treat a bare four-digit segment in 1900-2100 as a year, and a bare digit segment
  directly following a 'page' or 'seite' segment as a page number, and stop both from
  counting as a job ID. Keep UUIDs and 5+ digit runs matching as before.
- 'The T-0007 reviewer verified, and I re-checked in the tree today (the `part.isdigit()
  and len(part) >= 3` branch is still at :262), that adding a `continue` after the
  pure-digit branch in _has_posting_id is safe: _DIGIT_RUN_RE is \d{5,} and cannot
  match a <=4-character pure-digit segment, so skipping the later branch for a rejected
  short segment loses no prior true positive. Keep that property and say in the output
  that you checked it.'
- 'Tests: /careers/2024/ and /jobs/page/2 classify as LISTING or INDEX; a real 5+
  digit posting id still classifies as POSTING; a four-digit segment outside the year
  range (e.g. /jobs/4821) keeps its current classification; a UUID path still classifies
  as POSTING.'
- Acceptance must show posting_shape_rate at or above the committed baseline and no
  metric below it; quote the delta table. If T-0028 has already landed, its vendor
  branches must stay green - extend the file, do not restructure it.
- No new dependency, no network in tests, no key anywhere.
