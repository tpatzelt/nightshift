title: Tell an active user whose CV or preferences are missing why their scan did
  not run, and stop the scheduler re-queuing them every minute (re-issue of planned
  T-0051, which never reached the backlog)
why: G3 requires that an error during a scan produce a message naming what failed.
  At HEAD cac026c, src/bot_service.py:280-282 `_run_scan` returns early with only
  a log line when the user's record is active but `load_document(chat_id, 'cv')` is
  empty or `record.preferences` is falsy. /run (src/bot_service.py:194-199) has already
  told the user 'Scanning for jobs now - I'll message you with anything I find', and
  after that no message ever arrives. The early return also skips the `record.last_scan_at
  = time.time()` write at :286, so once the scan hour has passed, `_scheduler` (:232-247)
  finds the user due again and re-queues the same skipped scan every 60 s. This is
  the last silent scan-failure path found in M3. Three planner passes proposed it
  as T-0051, and it never landed in the backlog.
