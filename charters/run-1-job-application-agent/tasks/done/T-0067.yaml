why: 'G3''s definition of done says every user-visible message path must have a test
  that asserts its content. On a scratch copy at HEAD cc1a1b6 I checked each reply
  path in src/intake.py against the tests. Two paths reach the user through BotService._dispatch
  -> send_message and are only checked by fragments. The first is _handle_active_chat
  (src/intake.py:192): tests/test_intake.py:465 test_active_state_chat_reply checks
  two substrings. The second is the /start reply when the user is already active,
  in _handle_start (src/intake.py:126-130): tests/test_intake.py:481 test_start_reply_when_already_active
  checks three substrings, so the parameter block could change without any test failing.
  I drove both paths with the existing COMPLETE extraction and the test file''s _manager/_msg/_doc
  helpers. The replies are "You''re all set up - I''m scanning for jobs regularly.\n"
  + HELP_TEXT and "You''re already set up. Your search parameters:\n\U0001f3af Roles:
  Project Manager\n\U0001f4cd Locations: Berlin, Germany\n\U0001f511 Keywords: digital
  transformation\n\U0001f3ed Industries: public sector\n\U0001f310 Language: English\n\nUse
  /run to scan now or /reset to start over." Equality assertions for both passed on
  the scratch copy. This is tests-only idle work, strictly within G3.'
