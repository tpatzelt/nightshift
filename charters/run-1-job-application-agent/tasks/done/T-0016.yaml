notes:
- 'Name the failing exception class and a one-line cause (str(exc), whitespace-collapsed,
  truncated to about 300 characters), keep the existing retry sentence, and say what
  the user can do next. Scrub anything secret-shaped before sending: never interpolate
  the bot token, the Brave or OpenRouter key, and strip query strings plus any ''bot<digits>:<secret>''
  path segment from URLs, because a requests exception message routinely carries the
  request URL. No live Telegram call anywhere - TELEGRAM_BOT_TOKEN is absent by design;
  monkeypatch the send boundary the way tests/test_notifier.py already does. Tests:
  the sent text names the exception type and the cause; a RequestException whose message
  embeds a URL with a key or token leaks neither; a very long cause still produces
  a message inside the Telegram limit. Keep the scheduler and queue behaviour untouched.'
