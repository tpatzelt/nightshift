notes:
- Change tests only. src/** is protected. If a path cannot be asserted without changing
  source, report a followup and do not edit src.
- '''At the send boundary'' means: monkeypatch requests.post in the src.telegram_api
  module with a fake whose .json() returns {''ok'': True, ''result'': {}}, record
  every json= payload, and assert on payload[''text'']. Do not replace svc._telegram.send_message
  or svc._safe_send.'
- 'Test 1, the scan error: raise from svc._run_scan an exception that carries a secret-bearing
  URL and also a non-secret cause that survives scrubbing, e.g. RuntimeError(''POST
  https://api.telegram.org/bot123456:SECRETTOKEN/sendMessage?key=BRAVE_SECRET failed
  with 502 Bad Gateway''). Drive _scan_worker once with the existing _stop.is_set
  counter pattern (tests/test_bot_service.py:129-135). Assert exactly one sendMessage
  payload, with chat_id ''42''. Its text must contain ''RuntimeError'', ''failed with
  502 Bad Gateway'', ''/bot***'' and ''/send /run to retry'' wording as sent. It must
  not contain ''123456:SECRETTOKEN'', ''SECRETTOKEN'' or ''BRAVE_SECRET''. This is
  the cause assertion the T-0031 attempt-1 reviewer asked for: assert the cause text
  itself, not only the type name.'
- 'Test 2, the dispatch failure: build the service with _service(tmp_path, dashboard_enabled=False)
  so that no port is bound. Replace svc._scan_worker and svc._scheduler with no-op
  lambdas on the instance so their threads exit at once. Stub svc._dispatch to raise.
  The fake requests.post routes on the URL suffix: getMe returns {''ok'':True,''result'':{''username'':''x''}},
  getUpdates returns one update {''update_id'':1,''message'':{''chat'':{''id'':7},''text'':''hi'',''from'':{''first_name'':''A''}}},
  and sendMessage records the payload. Stub _stop.is_set so the while loop runs exactly
  one pass. Assert one sendMessage with chat_id 7 or ''7'' (as sent) and text exactly
  ''⚠️ Something went wrong handling that message. Please try again.''. The test must
  not sleep for real: monkeypatch src.bot_service.time.sleep to fail the test if called.'
- Keep the existing test at tests/test_bot_service.py:114. You may strengthen it but
  must not weaken or delete it.
- No network and no live Telegram call. Do not depend on TELEGRAM_BOT_TOKEN, which
  is deliberately absent.
