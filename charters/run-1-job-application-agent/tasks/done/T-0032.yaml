why: 'G3''s definition of done needs ''an error during a scan produces a message naming
  what failed'', and every user-visible message path needs a test that asserts its
  content. T-0031 tried to cover six message paths in one task. The reviewer sent
  attempt 1 back over item (d), and attempt 2 ended with no status, most likely because
  it ran out of turns or time. This slice is the two paths nothing asserts today.
  First, the scan-error text sent by BotService._scan_worker (src/bot_service.py:249-260).
  tests/test_bot_service.py:114 checks it only after replacing svc._telegram.send_message,
  so _scrub_secrets (:65) is never checked in the payload Telegram would actually
  receive. Second, the reply in BotService.run (:171-176) when a message fails to
  dispatch: ''⚠️ Something went wrong handling that message. Please try again.'' No
  test covers it at all.'
