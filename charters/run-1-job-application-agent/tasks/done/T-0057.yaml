notes:
- 'Keep the change minimal. CrawlerEngine gets a `last_search_error: str | None` attribute,
  set to None at the start of every search() call and set to the error string on the
  transport-failure branch at src/crawler_engine.py:268. The budget-exhausted early
  return is not an error and must leave it None. search() still returns [] and still
  does not consume search budget.'
- In the orchestrator, right after the 'search' tool invoke at src/orchestrator.py:184,
  read getattr(self._crawler, 'last_search_error', None). When it is set, call report.record_error('search_failed',
  query, RuntimeError(error)). Use getattr so the test doubles in tests/ and run_mock_test.py
  that lack the attribute keep working.
- Add COUNTER_LABELS['error_search_failed'] in src/run_report.py, e.g. 'web searches
  failed (Brave API error)'.
- 'Tests: in tests/test_search_resilience.py, reuse _make_engine. Assert last_search_error
  is set after a persistent error, and is None after a good payload and after a legitimately
  empty one. In tests/test_run_quality.py, use a ScriptedCrawler subclass that sets
  last_search_error, then assert runs.json has error kind ''search_failed'' and counter
  error_search_failed == 1. Optionally, assert the resulting _empty_scan_explanation
  text in tests/test_bot_service.py.'
- The error string lands only in runs.json and never in a Telegram message. The Brave
  key travels in a header, never in the error text. Do not log or store request headers.
- Offline only. Live Brave calls are not needed for this task; if you make one anyway,
  make at most one and do not add it to any test. Do not reformat or rename existing
  code.
