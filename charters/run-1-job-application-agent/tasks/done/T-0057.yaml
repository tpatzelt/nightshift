title: Record a failed Brave search in the RunReport so an empty scan names it instead
  of looking like 'no results'
why: Verified at read-only HEAD 7e87c91. When Brave fails at the transport level after
  three attempts, CrawlerEngine.search (src/crawler_engine.py:268-275) logs a warning
  and returns []. The orchestrator (src/orchestrator.py:184-187) then counts urls_found
  += 0, and no error is recorded. A scan against a Brave outage, a bad key or an exhausted
  quota therefore reaches the user as 'no new matching jobs this time... I could not
  fetch any job pages this run.' Nothing in the message says the search itself failed.
  The G3 definition of done requires 'an error during a scan produces a message naming
  what failed'. This task records the failure. T-0056 makes the message render error_
  counters, which is why this task depends on it.
