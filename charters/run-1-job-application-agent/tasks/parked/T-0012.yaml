notes:
- 'Add roughly 20-30 records across the existing fixture files, or new *.jsonl files
  whose stem is already a profile name in evals/profiles.py (project-manager-berlin,
  data-engineer-amsterdam and food-product-manager-berlin are defined but unused);
  do not edit evals/profiles.py, or locations_for() will return [] and location_match_rate
  becomes meaningless. The charter invites live validation: spend a small, budgeted
  number of real Brave searches to source genuine URL shapes and page text (keep exploratory
  runs tiny, never loop a search), then hand-label what comes back. Never write a
  key into a fixture, a log or a commit. Labels are ground truth read off the page
  - never generated from classify_url/find_stale_marker, or the metrics become tautologies.
  Cover five categories: (1) postings on ATS vendors _ats_kind does not know (bamboohr.com,
  teamtailor.com, softgarden.io/.de, jobvite.com, breezy.hr, applytojob.com, icims.com,
  taleo.net, pinpointhq.com, hire.withgoogle.com) plus each vendor''s board root labelled
  listing; (2) non-postings with digit-shaped paths, e.g. /careers/2024/ and /jobs/page/2,
  labelled listing or index; (3) index pages on the hosts T-0006 added (kununu.com,
  devjobs.de, stellenanzeigen.de, stellenmarkt.de, meinestadt.de, jobware.de, absolventa.de,
  jobvector.de, talent.com, careerjet., neuvoo., simplyhired., whatjobs.com, jobsora.)
  labelled aggregator index - these are what will finally give aggregator_drop_rate
  headroom at arming; (4) near-duplicate pairs differing only by scheme, a www. prefix,
  or query-parameter order, with duplicate_of set; (5) postings closed with the wordings
  T-0009 targets, English and German, labelled stale. Give each record realistic page
  text, including the location as a real page states it. Then re-freeze with `uv run
  python -m evals.rebaseline --corpus evals/fixtures --out evals/baseline.json`: the
  baseline must be computed from ARMING src, never from the current tree. Put the
  arming-vs-current delta table in the task output. If the expanded corpus shows any
  metric where current is BELOW arming, do not delete or soften the record - that
  is a real regression T-0006 introduced; keep it, report it as a followup naming
  the records, and say so in the output.'
