title: Extend the labelled corpus with the URL shapes the code actually gets wrong,
  then re-freeze the arming baseline
why: On the present 23-record corpus the arming baseline is already 1.000 for aggregator_drop_rate,
  location_match_rate and staleness_detection_rate, so G2's required improvement in
  aggregator-drop rate is arithmetically impossible and T-0006's aggregator widening
  provably moved no metric (the planner replayed this corpus against arming src and
  got the frozen baseline back, delta +0.000 on all five). The harness can only measure
  quality changes if the corpus contains the shapes the deterministic logic gets wrong.
