notes:
- 'Keep the ledger inside TelegramNotifier so the fix stays in the three modules G3
  names: an optional ledger_path constructor argument, default None meaning today''s
  behaviour. notify_results filters out results whose canonical_url is already in
  the ledger, and records a URL only after its message actually sent (the bool from
  _send) - so a Telegram outage leaves the job unnotified and retryable rather than
  silently swallowed. Wire it at the two construction sites: src/bot_service.py:269
  derives the path as paths[''cache_path''].parent / ''notified.json'' (do not add
  a key to user_store.crawl_paths - src/user_store.py is protected), and src/main.py:43
  puts it next to config.cache_path. Store JSON; create on demand; an unreadable or
  corrupt ledger logs a warning and reads as empty, never raises, because a notifier
  failure must not break a crawl. Use src.url_heuristics.canonical_url for the key
  so the ledger and the cache agree after T-0008. Tests: two runs over the same result
  notify once; a result whose send returned False is not recorded and IS re-sent next
  run; a corrupt ledger file degrades to empty without raising; the reason line added
  by T-0010 still appears. No live Telegram call - monkeypatch requests.post as the
  existing tests do.'
