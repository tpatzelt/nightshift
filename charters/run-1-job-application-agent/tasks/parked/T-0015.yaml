title: 'Never notify twice: a durable ledger of delivered postings'
why: Orchestrator._notify (src/orchestrator.py:272) discards the bool notify_results
  returns and the seen-URL cache is written before notification (src/orchestrator.py:230),
  so a posting whose send failed is marked seen and never re-sent, while a lost or
  re-keyed cache announces the same posting again - and T-0008 deliberately changes
  canonical_url, so existing cache.json keys stop matching on the next run. G3 requires
  that a job already notified is provably not notified again.
