title: 'Score results, not hub pages: make the harness sensitive to posting-vs-listing'
why: 'evals/offline_eval.py:60 replay_keep drops only OTHER URLs and aggregator INDEX
  pages, so a page classified LISTING (or non-aggregator INDEX) counts as kept. Production
  does the opposite: src/orchestrator.py:406 harvests posting links out of any non-POSTING
  page and returns without scoring it, so a careers/board hub never becomes a JobResult.
  Consequence, which I verified by replaying evals/fixtures against the current tree:
  reclassifying a vendor board root from POSTING to LISTING changes no metric whatsoever,
  because the record stays in kept either way. posting_shape_rate is one of the two
  metrics G2''s definition of done names as must-improve, so until kept models ''what
  becomes a reported result'', T-0021 and T-0022 are arithmetically unable to move
  it and a worker would be pushed toward gaming the number. Measured today: kept 12
  -> 9 under posting-only semantics, posting_shape_rate 0.750 -> 1.000, other four
  metrics unchanged; the three records that leave are correctly-classified careers
  pages (dataforge/pixelforge/exampleai .example/careers).'
