title: Re-derive the arming baseline by replaying the corpus against the arming revision
why: evals/baseline.json is frozen against today's 23-record corpus, so any corpus
  change silently invalidates the G2 comparison and the only alternative is re-recording
  the baseline from already-improved code, which would erase the improvement it is
  supposed to measure. A tool that materialises src/ from a git revision and replays
  the current corpus through the current harness makes the arming baseline re-derivable
  at any time.
