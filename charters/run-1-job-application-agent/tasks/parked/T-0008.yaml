notes:
- 'In canonical_url: normalise the scheme to https for http URLs, strip a leading
  www. from the host, and sort the surviving query pairs before urlencode so parameter
  order stops mattering. Keep a non-default port, keep the existing tracking-param
  and /apply handling, keep returning the input unchanged for a URL with no scheme.
  Do not touch callers - Orchestrator._load_cache, _new_urls, _triage_urls and _merge_with_previous
  already route through canonical_url, and tests/test_run_quality.py::test_same_posting_behind_tracking_params_is_fetched_once
  must stay green unedited, which is why it is protected. Note the consequence in
  the task output: an existing on-disk cache.json written with old keys will not match
  new keys, so the first run after this change may re-check some already-seen postings
  once; that is acceptable and self-healing, but say so. The acceptance run must show
  dedup_rate strictly above baseline with no metric below it.'
