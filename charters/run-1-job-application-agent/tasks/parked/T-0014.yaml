notes:
- 'Treat a bare four-digit segment in 1900-2100 as a year and a bare digit segment
  directly following a ''page'' or ''seite'' segment as a page number, and stop both
  from counting as a job ID. Keep UUIDs and 5+ digit runs. The T-0007 reviewer verified
  that adding a `continue` after the pure-digit branch is safe because _DIGIT_RUN_RE
  is \d{5,} and cannot match a <=4-character pure-digit segment, so no prior true
  positive is lost - keep that property and say in the output that you checked it.
  Tests: /careers/2024/ and /jobs/page/2 classify as LISTING or INDEX, a real 5+ digit
  posting id still classifies as POSTING, and a four-digit segment outside the year
  range (e.g. /jobs/4821) keeps its current classification. Acceptance must show posting_shape_rate
  at or above what T-0013 left it and no metric below baseline.'
