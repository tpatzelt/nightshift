title: Drop soft-404 search-landing pages served at a posting URL (re-issue of planned
  T-0037, which never reached the backlog)
why: 'This is the last G2 headroom the corpus can show. Replaying HEAD 8f821e6 offline
  gives a TOTAL of posting_shape_rate 0.941 and aggregator_drop_rate 0.941 (arming
  baseline 0.815 and 0.765), with the other metrics at 1.000. Both misses are the
  same record: evals/fixtures/project-manager-berlin.jsonl line 5, https://de.whatjobs.com/jobs?id=261276305.
  It returns HTTP 200 and its title is ''Jobs in Deutschland? | WhatJobs Deutschland''.
  The body is only site navigation and search-form text (''Suche nach Berufsbezeichnung
  oder Rolle und nach Standort ... Suchvorschläge und letzte Suchanfragen''). It is
  labelled kind=index, aggregator=true, stale=false. The URL classifier is right to
  call /jobs?id=<n> a posting: tests/test_url_heuristics.py:208 pins that shape, so
  it must not change. The evidence that the page is dead is only in the page text.
  The fix is therefore a page signal next to find_stale_marker (src/page_signals.py:112),
  applied where the stale gate runs (src/orchestrator.py:437 and evals/offline_eval.py
  replay_keep, line 94).'
