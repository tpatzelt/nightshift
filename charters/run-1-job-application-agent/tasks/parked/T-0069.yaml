title: Assert the exact text of the motivation-received reply, the job-prefs prompt
  and the mid-setup /status replies (re-issue of planned T-0068, which never reached
  the backlog)
why: 'G3''s definition of done says every user-visible message path must have a test
  that asserts its content. Decision 20260924-091232 planned T-0068 for this, but
  T-0068 never reached /plan/backlog. At HEAD 8e4db4e I compared src/intake.py with
  tests/test_intake.py and found these replies still checked only by substring. (1)
  tests/test_intake.py:423 test_uploaded_motivation_letter_reply_and_job_prefs_prompt:
  the reply from src/intake.py:165 is "✅ Motivation letter received.\n\n" + the job-prefs
  prompt. (2) tests/test_intake.py:436 test_job_prefs_prompt_after_motivation_skip:
  the reply from src/intake.py:160 is the job-prefs prompt alone. (3) tests/test_intake.py:543,
  the /status reply while awaiting_motivation, is "Setup in progress (step: awaiting_motivation).\nPlease
  upload your motivation letter, or send /skip." (4) tests/test_intake.py:561, the
  /status reply in an unknown state, is "Setup in progress (step: some_unknown_state).\nSend
  /start to begin." (5) tests/test_intake.py:247 test_status_during_setup_and_when_active:
  the first /status, sent while awaiting_cv, is "Setup in progress (step: awaiting_cv).\nPlease
  upload your CV (PDF, DOCX, or text)." The job-prefs prompt (src/intake.py:336-342)
  is "Now describe the jobs you''re looking for: roles, industries, seniority, remote/on-site,
  and where you want to work (country and cities). You can also upload a document.
  Send /skip to let me infer everything from your CV."'
