- 'Colour the favicon from the palette in style.css: --bg #0a0b14, --accent-violet
  #9d7bff, --accent-cyan #4fd8e6, --accent-pink #ff6fb0. Keep it simple enough to
  read at 16x16, e.g. 3 to 5 circles joined by lines.'
- Keep every existing <link> and <script> tag, the Google Fonts preconnects and {{
  content }}. Do not reorder the scripts.
- No external requests beyond those already present, no secrets and no personal data.
  Do not touch _config.yml.
- Run the acceptance commands from the repo root.
