title: 'Carry the artsy identity into browser chrome: inline SVG favicon with a neural-net
  motif, plus a theme-color meta tag'
why: T-0001 to T-0004 restyled the page, but _layouts/default.html still has no favicon
  and no theme-color. The browser tab shows a generic icon and the mobile address
  bar stays default grey or white. That breaks the art-directed look G1 asks for at
  the first thing a visitor sees. A small SVG mark in the palette (a few nodes and
  weighted edges in violet, cyan and pink on the ink background) and a theme-color
  matching --bg finish the design without adding assets or personal data.
