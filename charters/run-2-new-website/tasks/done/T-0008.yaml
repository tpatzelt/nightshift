title: Use the --bg token as the page base colour and remove the dead .greeting rule
  in style.css
why: body uses var(--bg-elevated) (#14172c) as its base colour. The theme-color meta
  and the favicon use --bg (#0a0b14), so the browser chrome and the page don't match.
  style.css also still styles a .greeting class that no markup uses. Aligning the
  base colour with the design token and removing dead CSS keeps the palette consistent.
