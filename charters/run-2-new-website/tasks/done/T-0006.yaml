title: Make the typing effect and pointer parallax in main.js respect prefers-reduced-motion
why: 'The artsy motion layers (canvas, shapes, status dot, buttons) already honour
  prefers-reduced-motion in style.css and background.js. assets/js/main.js does not:
  it still types the tagline one character at a time and still moves the --bg-x/--bg-y/--bg-rot
  parallax on every mouse move. The design should handle reduced motion the same way
  everywhere.'
