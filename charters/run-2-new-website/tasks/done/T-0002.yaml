title: Add a generative ML-themed canvas background (neural-net / latent-space motif)
why: For G1, the page needs a visual signature that says both 'art' and 'machine learning'.
  The hero is currently plain text on flat black, and the .floating-shapes block in
  index.html is set to display:none. A lightweight canvas background, such as drifting
  nodes with weighted edges or a loss-landscape contour field, drawn in the palette's
  accent colours, gives the page that identity.
