notes:
- Create the new file assets/js/background.js and load it from _layouts/default.html
  with a plain <script> tag. Do not use external libraries or CDNs.
- The canvas must be fixed, sit behind the content (negative z-index), use pointer-events:none
  and aria-hidden="true", and read its colours from the CSS custom properties added
  in T-0001 via getComputedStyle.
- 'Honour prefers-reduced-motion: draw one static frame and do not animate. Also pause
  the animation when document.hidden, and cap the node count so it stays light on
  mobile.'
- Do not break the cat cursor (cat-cursor.js) or the typing effect (main.js).
