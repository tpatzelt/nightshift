# NIGHTSHIFT egress proxy. The jail network has no route out; this is the only door.

# --- who may ask -------------------------------------------------------------
acl jail src 172.30.99.0/24
http_access deny !jail

# --- where they may never go -------------------------------------------------
# Tim's LAN, his other containers, link-local (cloud metadata) and CGNAT. Listed
# as destination addresses, so a hostile or hijacked DNS name that resolves into
# these ranges is still refused.
acl private_dst dst 10.0.0.0/8
acl private_dst dst 172.16.0.0/12
acl private_dst dst 192.168.0.0/16
acl private_dst dst 169.254.0.0/16
acl private_dst dst 100.64.0.0/10
acl private_dst dst 127.0.0.0/8
acl private_dst dst ::1/128
acl private_dst dst fc00::/7
acl private_dst dst fe80::/10
http_access deny private_dst

# --- what they may do --------------------------------------------------------
# Open egress, enabled deliberately on 2026-09-22 so agents can develop and test
# against the live Brave and OpenRouter APIs. The domain allowlist is no longer
# consulted; what still protects this machine sits above and below:
#   - private_dst (line 20) denies the LAN, the other containers, cloud metadata
#     and CGNAT, even when a public name resolves into those ranges
#   - the jail network is --internal, so this proxy remains the only door out
#   - DOCKER-USER inside dind drops everything from the jail except this port
#   - managed-settings.json + guard.py still deny curl, wget, ssh and any git push
acl web_ports port 80 443
acl CONNECT method CONNECT

http_access deny CONNECT !web_ports
http_access allow jail web_ports
http_access deny all

http_port 3128

# --- logging (read from the host at data/logs/proxy/) ------------------------
logformat nightshift %tl %>a %Ss/%03>Hs %<st %rm %ru %un %Sh/%<a %mt
access_log /var/log/squid/access.log nightshift
cache_log /var/log/squid/cache.log

# No caching: agents must see what the registries actually serve.
cache deny all
cache_store_log none

# Say as little as possible to the client.
httpd_suppress_version_string on
via off
forwarded_for delete
request_header_access X-Forwarded-For deny all

dns_v4_first on
shutdown_lifetime 5 seconds
pid_filename /var/run/squid/squid.pid
